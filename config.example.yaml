# dfe-fetcher configuration example
# Copy to config.yaml and customise for your environment
#
# Environment variables: DFE_FETCHER_* prefix
# Nesting: DFE_FETCHER_SCHEDULER__DEFAULT_INTERVAL_SECS=300
# Config reload: send SIGHUP to reload

# =============================================================================
# Instance Identity
# =============================================================================
# Auto-derived from source config if omitted.
# Explicit ID recommended for production — prevents cursor key collisions.
# instance_id: "contoso-m365"

# =============================================================================
# Scheduler
# =============================================================================
# Interval and jitter are HOT-RELOADED — changes take effect on next fetch cycle.
# max_concurrent_fetches REQUIRES RESTART (semaphore created at startup).
scheduler:
  default_interval_secs: 300    # 5 minutes — hot-reloaded
  max_concurrent_fetches: 10    # REQUIRES RESTART
  jitter_percent: 10            # Avoid thundering herd — hot-reloaded

# =============================================================================
# Native Sources (Rust-native, maintained in this repo)
# =============================================================================
# Decision: use native source when a good Rust crate exists.
# Otherwise, use a container extractor.

# Sources — filter is HOT-RELOADED (re-evaluated per record).
# enabled, credentials, services, topic REQUIRE RESTART.
sources:
  aws:
    enabled: false              # REQUIRES RESTART
    region: "us-east-1"
    # access_key_id: ""         # Prefer credential_secret in production
    # secret_access_key: ""
    # assume_role_arn: ""
    # credential_secret: "vault:secret/aws:credentials"
    # interval_secs: 300        # Override default
    services:
      - name: cloudtrail
      - name: guardduty
      - name: securityhub
      - name: config
    topic: "aws"
    # filter: 'eventName != "ConsoleLogin"'  # hot-reloaded

  azure:
    enabled: false
    # tenant_id: ""
    # client_id: ""
    # client_secret: ""
    # credential_secret: "vault:secret/azure:credentials"
    # subscription_id: ""
    services:
      - name: activity_log
      - name: defender
      - name: sentinel
      - name: entra_id
    topic: "azure"
    # filter: 'level == "Critical" || level == "Error"'  # hot-reloaded

  m365:
    enabled: false
    # tenant_id: ""
    # client_id: ""
    # client_secret: ""
    # credential_secret: "vault:secret/m365:credentials"
    services:
      - name: audit_log
      - name: message_trace
      - name: dlp
      - name: alerts
    topic: "m365"
    # filter: 'Workload != "Exchange"'  # hot-reloaded

  gcp:
    enabled: false
    # project_id: ""
    # service_account_key: "/etc/gcp/sa-key.json"
    # credential_secret: "vault:secret/gcp:credentials"
    services:
      - name: audit_logs
      - name: scc
      - name: cloud_logging
    topic: "gcp"
    # filter: 'severity != "INFO"'  # hot-reloaded

# =============================================================================
# External Extractors — ALL REQUIRE RESTART
# =============================================================================
# For tools that don't have good Rust crates — wrap in containers.
# One container per source + config. Can run N instances with different configs.

extractors:
  # Container-based extractors (Docker/podman)
  containers: []
    # Example: CloudWatch metrics via YACE
    # - name: cloudwatch-metrics-prod
    #   image: ghcr.io/nerdswords/yet-another-cloudwatch-exporter:v0.62.0
    #   runtime: docker              # docker or podman
    #   mode: scheduled              # scheduled (one-shot) or continuous
    #   communication: stdout        # stdout (JSON lines) or http (POST)
    #   topic: aws_cloudwatch_land
    #   interval_secs: 300
    #   timeout_secs: 600            # Kill container after this many seconds (scheduled mode)
    #   pull_policy: if-not-present  # always, if-not-present, or never
    #   env:
    #     AWS_REGION: us-east-1
    #     AWS_ACCESS_KEY_ID: "vault:secret/aws:access_key"
    #     AWS_SECRET_ACCESS_KEY: "vault:secret/aws:secret_key"
    #   memory_limit: "512m"
    #   cpu_limit: 0.5
    #   max_restart_attempts: 0      # 0 = unlimited
    #   max_restart_backoff_secs: 60
    #   stable_after_secs: 300

    # Example: Multiple M365 orgs (same tool, different config)
    # - name: m365-org-alpha
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-alpha-uuid"
    #     M365_CLIENT_ID: "client-alpha-uuid"
    #     M365_CLIENT_SECRET: "vault:secret/m365/alpha:client_secret"

    # - name: m365-org-beta
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-beta-uuid"
    #     M365_CLIENT_ID: "client-beta-uuid"
    #     M365_CLIENT_SECRET: "vault:secret/m365/beta:client_secret"

  # Vector.dev extractor integration
  vector:
    enabled: false
    grpc_bind_address: "0.0.0.0:6000"
    instances: []
    # - name: syslog-collector
    #   mode: container
    #   image: timberio/vector:latest-alpine
    #   vector_config: |
    #     [sources.syslog]
    #     type = "syslog"
    #     address = "0.0.0.0:514"
    #     [sinks.dfe]
    #     type = "vector"
    #     address = "dfe-fetcher:6000"
    #   topic: syslog_land

# =============================================================================
# Ingest server — REQUIRES RESTART
# =============================================================================
# HTTP server binds at startup; auth token resolved once.
ingest:
  enabled: true
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760     # 10MB
  # auth_token: "vault:secret/dfe:ingest_token"

# =============================================================================
# Output transport — REQUIRES RESTART
# =============================================================================
# Transport connections are established at startup.
# Default: kafka (backward compatible with top-level kafka: section)
# output:
#   type: kafka            # "kafka" | "grpc" | "both"
#   kafka:
#     profile: production
#     brokers: ["kafka:9092"]
#     client_id: "dfe-fetcher"
#   grpc:
#     endpoint: "http://dfe-receiver:6000"

# Kafka — transport config REQUIRES RESTART; topic_suffix is hot-reloaded.
kafka:
  brokers:                        # REQUIRES RESTART
    - "localhost:9092"
  client_id: "dfe-fetcher"       # REQUIRES RESTART
  topic_suffix: "_land"          # hot-reloaded
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: "/etc/ssl/kafka-ca.crt"
  producer:
    batch_size: 8388608       # 8MiB
    batch_messages: 10000
    linger_ms: 20
    compression: "zstd"
    acks: "all"
    retries: 5

# =============================================================================
# Buffer / Memory — REQUIRES RESTART
# =============================================================================
buffer:
  memory_limit: 0             # 0 = auto-detect (67% available)
  pressure_threshold: 0.8

# =============================================================================
# Dead Letter Queue — REQUIRES RESTART
# =============================================================================
# Messages that fail Kafka delivery are routed to the DLQ for later replay.
# File-only mode writes DLQ entries to local disk as JSON lines.
dlq:
  enabled: false
  # mode: file_only               # file_only (default), cascade, fan_out, kafka_only
  # file:
  #   path: "/var/lib/dfe-fetcher/dlq"
  #   rotation: daily              # daily, hourly, size_mb
  #   max_age_days: 7
  #   compress_rotated: true

# =============================================================================
# Metrics — REQUIRES RESTART
# =============================================================================
metrics:
  enabled: true
  address: "0.0.0.0:9090"

# =============================================================================
# Cursor Store (incremental fetching)
# =============================================================================
# Tracks the last successful fetch window per source so restarts resume
# from where they left off instead of re-fetching the same time range.
# store/file_path/kafka_topic REQUIRE RESTART (cursor store created at startup).
# default_window_hours is HOT-RELOADED (re-read when no cursor exists).
# cursor:
#   store: auto            # "auto" | "kafka" | "file" — REQUIRES RESTART
#   file_path: "/var/lib/dfe-fetcher/cursors"  # REQUIRES RESTART
#   kafka_topic: "dfe-fetcher-cursors"         # REQUIRES RESTART
#   default_window_hours: 1                    # hot-reloaded
