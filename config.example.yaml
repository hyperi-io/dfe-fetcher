    topic: "gcp"
    # filter: 'severity != "INFO"'  # hot-reloaded

  # ---------------------------------------------------------------------------
  # Declarative REST sources (the source framework) -- REQUIRE RESTART
  # ---------------------------------------------------------------------------
  # An instance binds a PROFILE (the shape of an API: base URL template,
  # accepted auth modes, endpoints with their decoder and pager) to this
  # deployment's IDENTITY (base URL, credential kind and refs, topic,
  # interval). The map key is the connection id: the cursor key, the metric
  # and log label, and the `_source_fetcher` prefix. Two instances of one
  # profile with different credential kinds is the normal case.
  #
  # `profile:` names a shipped profile or carries one inline. Unknown keys,
  # decoders, pagers and auth modes fail the load with the YAML line; an
  # instance whose mode the profile does not accept, or that lacks the
  # credential field for it, fails validation with its field path.
  #
  # Shipped profiles (see crates/fetcher/profiles/): aws, azure, bitwarden,
  # cloudflare, crates_io, crowdstrike, duo, gcp, gcp_pubsub, github,
  # go_modules, google_workspace, m365, object_store, okta, onepassword,
  # pypi, runzero, salesforce, slack. Every typed block above with one of
  # those names is the same profile behind its typed config: each block maps
  # onto an instance at load, so the blocks stay as they are and
  # `sources.rest` is for a second instance of a shape or an API with no
  # block.
  rest:
    # -------------------------------------------------------------------------
    # runZero -- asset inventory snapshots from the export API
    # -------------------------------------------------------------------------
    # Every store the profile declares (assets, services, software, ... see
    # crates/fetcher/profiles/runzero.yaml) is a snapshot dump: each tick
    # streams the whole `.jsonl` export wrapped in the snapshot envelope
    # (begin / row / end markers on the store's own topic `<topic>-<store>`),
    # so a consumer rebuilds a complete inventory by snapshot id. Nothing is
    # incremental; the cursor never advances.
    #
    # A self-hosted console and the cloud console are two INSTANCES of the one
    # profile with different logins. Self-hosted: the organisation's export
    # token as a static bearer, which every store accepts. Cloud: an OAuth2
    # API client scoped to the organisation, which needs `_oid` on every call
    # and is refused on the stores that need an export token.
    runzero_self_hosted:
      enabled: false
      topic: "runzero"                  # stores land on runzero-assets, runzero-services, ...
      interval_secs: 3600
      # filter: 'record.alive == true'  # CEL over the enveloped row; hot-reloaded
      auth:
        mode: bearer
        token: "vault:kv/data/runzero/self_hosted:export_token"   # the organisation's Export token
      vars:
        base_url: "https://runzero.example.internal/api/v1.0"     # required, no default
        # org_id unset: the export token is bound to one organisation, so
        # `_oid` is omitted from every request.
      # units:                           # optional per-store narrowing
      #   assets: { query: { fields: "id,alive,addresses,names,os,type" } }
      #   services: { query: { search: "alive:t" } }
      #   wireless: { enabled: false }
      # accumulate: { max_bytes: 4194304 }   # per-instance override of the section below
      profile: runzero
    runzero_cloud:
      enabled: false
      topic: "runzero-cloud"            # or "runzero" to land in the same tables, told apart by _source_fetcher
      interval_secs: 86400
      auth:
        mode: oauth2_client_credentials
        client_id: "00000000-0000-0000-0000-000000000000"          # the API client's id (not a secret)
        client_secret: "vault:kv/data/runzero/cloud:client_secret"
      vars:
        base_url: "https://console.runzero.example/api/v1.0"
        org_id: "00000000-0000-0000-0000-000000000000"             # required with OAuth2: 400 without it
      units:
        # An OAuth2 client with the inventory grant is refused on these four;
        # a refused export is terminal for the tick and ticks the console's
        # throttle, so leave them off on an OAuth2 instance.
        findings: { enabled: false }
        tasks: { enabled: false }
        users: { enabled: false }
        groups: { enabled: false }
      profile: runzero
    # -------------------------------------------------------------------------
    # Datadog -- two credentials on the one request
    # -------------------------------------------------------------------------
    # Datadog authenticates a call with an api key AND an application key: the
    # api key names the organisation, the application key scopes the call to a
    # user's permissions, and the call is refused without both. The profile
    # declares WHERE each goes (a header of its own); the instance names the
    # spec each is read from. An API that instead wants both halves inside one
    # header value (Tenable's `accessKey=x;secretKey=y`) declares one placement
    # with a `value` composed of the same names -- see
    # docs/reference/profile-grammar.md.
    datadog:
      enabled: false
      topic: "datadog"
      interval_secs: 300
      auth:
        mode: credentials
        credentials:
          api_key: "vault:kv/data/datadog/prod:api_key"
          application_key: "vault:kv/data/datadog/prod:application_key"
      vars:
        api_url: "https://api.datadoghq.com"   # the API host of this org's site
      # units:                                  # optional per-unit narrowing
      #   audit_events: { vars: { filter_query: "@evt.name:Dashboard" } }
      #   security_signals: { enabled: false }
      profile: datadog
    # A one-off API needs no shipped profile: write the shape inline. The same
    # grammar, with paging and a wrapped page body:
    # inventory_paged:
    #   enabled: true
    #   topic: inventory
    #   auth: { mode: api_key, key: "env:INVENTORY_API_KEY" }
    #   vars: { base_url: "https://inventory.example.internal/api" }
    #   profile:
    #     base_url: "{{ vars.base_url }}"       # a profile carries no literal URL
    #     shape: dump                           # incremental | dump
    #     auth: { accepts: [api_key], api_key: { header: Authorization, prefix: "Token " } }
    #     retry: { never_retry: [401, 403] }    # a refusal is terminal for the tick
    #     error: { at: "/error" }               # where a non-2xx body keeps its text
    #     endpoints:
    #       - unit: assets
    #         path: /assets
    #         query: { page_size: 500 }
    #         rows: { decoder: json_at, at: "/assets" }
    #         paginate: { strategy: cursor, from: "body:/next_key", into: "query:start_key", stop_when: "body.next_key == ''" }
    # An appliance that mints a session token from a login call instead of
    # serving OAuth2 -- vCenter, F5, Check Point. The login posts the
    # administrator's credentials, the token comes back in a response field or
    # header, and every later request carries it in the header the profile
    # names. No shipped profile, because each appliance's endpoint differs;
    # the full grammar is in docs/reference/profile-grammar.md.
    # appliance:
    #   enabled: true
    #   topic: appliance
    #   auth:
    #     mode: session_login
    #     username: "svc-dfe"
    #     password: "vault:kv/data/appliance:password"
    #   vars: { base_url: "https://appliance.example.internal/api" }
    #   profile:
    #     base_url: "{{ vars.base_url }}"
    #     shape: incremental
    #     auth:
    #       accepts: [session_login]
    #       session_login:
    #         url: "{{ vars.base_url }}/session"   # https or loopback, refused when the source binds
    #         send: body                           # body | basic
    #         token_at: "/session_token"           # or token_header: X-Subject-Token
    #         ttl_secs: 1800                       # the appliance states no expiry, so declare one
    #         header: X-Session-Token              # where every later request carries it
    #     endpoints:
    #       - unit: events
    #         path: /events

# =============================================================================
# Source framework: accumulate, oversize, self-regulation -- hot-reloaded per tick
# =============================================================================
# Framework sources pool rows and flush ONE transport batch when any bound is
# reached; a partial batch waits at most `window_ms` after its first row.
accumulate:
  max_rows: 1000
  max_bytes: 8388608
  window_ms: 1000
  in_flight: 1000                  # concurrent sends per flush; the whole batch
                                   # by default, because each send awaits its own
                                   # delivery report

# A framework row longer than `max_record_bytes` is replaced by an oversize
# stub (so a dump's row count still reconciles) and a copy cut at
# `max_dlq_bytes` goes to the dead-letter queue.
oversize:
  max_record_bytes: 921600
  max_dlq_bytes: 65536

# The memory-pressure brake: when the memory guard crosses `pause_above` a
# framework source stops polling its provider and flushes what it holds, and
# resumes below `resume_below`.
self_regulation:
  enabled: true
  pause_above: 0.80
  resume_below: 0.65

# =============================================================================
# External Extractors -- ALL REQUIRE RESTART
# =============================================================================
# For tools that don't have good Rust crates -- wrap in containers.
# One container per source + config. Can run N instances with different configs.

extractors:
  # Container-based extractors (Docker/podman)
  containers: []
    # Example: CloudWatch metrics via YACE
    # - name: cloudwatch-metrics-prod
    #   image: ghcr.io/nerdswords/yet-another-cloudwatch-exporter:v0.62.0
    #   runtime: docker              # docker or podman
    #   mode: scheduled              # scheduled (one-shot) or continuous
    #   communication: stdout        # stdout (JSON lines) or http (POST)
    #   topic: aws_cloudwatch_land
    #   interval_secs: 300
    #   timeout_secs: 600            # Kill container after this many seconds (scheduled mode)
    #   pull_policy: if-not-present  # always, if-not-present, or never
    #   env:
    #     AWS_REGION: us-east-1
    #     AWS_ACCESS_KEY_ID: "vault:kv/data/aws:access_key"
    #     AWS_SECRET_ACCESS_KEY: "vault:kv/data/aws:secret_key"
    #   memory_limit: "512m"
    #   cpu_limit: 0.5
    #   max_restart_attempts: 0      # 0 = unlimited
    #   max_restart_backoff_secs: 60
    #   stable_after_secs: 300

    # Example: Multiple M365 orgs (same tool, different config)
    # - name: m365-org-alpha
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-alpha-uuid"
    #     M365_CLIENT_ID: "client-alpha-uuid"
    #     M365_CLIENT_SECRET: "vault:kv/data/m365/alpha:client_secret"

    # - name: m365-org-beta
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-beta-uuid"
    #     M365_CLIENT_ID: "client-beta-uuid"
    #     M365_CLIENT_SECRET: "vault:kv/data/m365/beta:client_secret"

    # --- Filebeat sidecar examples -----------------------------------
    # Use Filebeat for log sources that established tools handle well.
    # Each runs as a container extractor -- stdout (JSON lines) or HTTP POST.

    # Example: Syslog collection via Filebeat
    # - name: filebeat-syslog
    #   image: docker.elastic.co/beats/filebeat:8.17.0    # REQUIRES RESTART
    #   mode: continuous                                    # REQUIRES RESTART
    #   communication: http                                 # Posts to /ingest/syslog
    #   topic: syslog
    #   env:
    #     FETCHER_INGEST_URL: "http://localhost:8080/ingest/syslog"
    #   volumes:
    #     - "/var/log/syslog:/var/log/syslog:ro"
    #     - "./filebeat-syslog.yml:/usr/share/filebeat/filebeat.yml:ro"
    #   max_restart_attempts: 0
    #   max_restart_backoff_secs: 60

    # Example: Windows event log forwarding
    # - name: filebeat-winevt
    #   image: docker.elastic.co/beats/filebeat:8.17.0
    #   mode: continuous
    #   communication: http
    #   topic: windows_events
    #   volumes:
    #     - "/mnt/winevt:/var/log/winevt:ro"
    #     - "./filebeat-winevt.yml:/usr/share/filebeat/filebeat.yml:ro"

    # Example: Custom application logs (stdout JSON output)
    # - name: filebeat-applog
    #   image: docker.elastic.co/beats/filebeat:8.17.0
    #   mode: continuous
    #   communication: stdout
    #   topic: application_logs
    #   volumes:
    #     - "/var/log/myapp:/var/log/myapp:ro"
    #     - "./filebeat-applog.yml:/usr/share/filebeat/filebeat.yml:ro"
    #   memory_limit: "256m"
    #   cpu_limit: 0.5

  # Vector.dev extractor integration
  vector:
    enabled: false
    grpc_bind_address: "0.0.0.0:6000"
    # On (the default), a push is answered only once its events reach the
    # outputs or the DLQ confirms them, and a failure answers UNAVAILABLE so
    # Vector re-sends. Off, a push is answered once queued and a crash loses it.
    acknowledgements:
      enabled: true
    # A Vector push names no instance, so the listener it arrives on decides
    # its topic. At most one instance shares grpc_bind_address (the one port
    # the chart publishes) and lands on its own topic, or pushes there land on
    # `vector` when none does. Every other instance names its own
    # grpc_bind_address, and its Vector sink must point at that address. Two
    # instances sharing the listener are refused at load. `topic` takes the
    # topic suffix like every other topic.
    instances: []
    # - name: syslog-collector
    #   mode: container
    #   # The default. Pin any other image by digest too.
    #   image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    #   # Written to a file mounted read-only into the container, read with
    #   # --config, removed at stop. Or name a file with vector_config_path.
    #   vector_config: |
    #     [sources.syslog]
    #     type = "syslog"
    #     address = "0.0.0.0:514"
    #     [sinks.dfe]
    #     type = "vector"
    #     inputs = ["syslog"]
    #     address = "dfe-fetcher:6000"
    #   topic: syslog
    # - name: firewall
    #   mode: sidecar
    #   grpc_bind_address: "127.0.0.1:6001"
    #   topic: firewall

# =============================================================================
# Ingest server -- REQUIRES RESTART
# =============================================================================
# HTTP server binds at startup; auth token resolved once.
# Off by default for two reasons. The listener counts as work, so turning it on
# holds this fetcher out of idle whether or not anything ever posts to it. And
# `/ingest/{source}/{topic}` takes its destination from the URL, so an enabled
# listener with no `auth_token` lets anything reaching the port write to any
# topic -- set `auth_token` whenever you enable it. Container extractors in HTTP
# mode are the only consumer.
ingest:
  enabled: false
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760     # 10MB
  # auth_token: "vault:kv/data/dfe:ingest_token"
  # On (the default), a POST is answered 200 only once its record reaches the
  # outputs or the DLQ confirms it, and 503 with Retry-After otherwise so the
  # client re-sends. Off, a POST is answered 200 at once and a failed delivery
  # or a crash loses it.
  acknowledgements:
    enabled: true

# =============================================================================
# Output transport -- REQUIRES RESTART
# =============================================================================
# Transport connections are established at startup.
# Default: kafka (backward compatible with top-level kafka: section)
#
# Every record goes to the transports under `type` -- its own topic on the bus,
# the configured endpoint on the direct transport. `destinations` declares other
# places a record can go, and `routes` sends matching records there instead: a
# transform, an archiver, or several at once. A backpressured destination HOLDS
# the batch and stalls the scheduler; the cursor does not advance and nothing is
# dead-lettered.
# output:
#   type: kafka            # "kafka" | "grpc" | "both"
#   kafka:
#     profile: production
#     brokers: ["kafka:9092"]
#     client_id: "dfe-fetcher"
#   grpc:
#     endpoint: "http://dfe-loader:6000"
#   destinations:
#     transform_orders:
#       grpc:
#         endpoint: "http://dfe-transform-orders:6000"
#     archiver:
#       grpc:
#         endpoint: "http://dfe-archiver:6000"
#   routes:
#     - match_field: "_source"
#       match_value: "orders"
#       destination: ["transform_orders", "archiver"]

# Kafka -- transport config REQUIRES RESTART; topic_suffix is hot-reloaded.
kafka:
  brokers:                        # REQUIRES RESTART
    - "localhost:9092"
  client_id: "dfe-fetcher"       # REQUIRES RESTART
  topic_suffix: "_land"          # hot-reloaded
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: "/etc/ssl/kafka-ca.crt"
  producer:
    batch_size: 8388608       # 8MiB
    batch_messages: 10000
    linger_ms: 20
    compression: "zstd"
    acks: "all"
    retries: 5

# =============================================================================
# Buffer / Memory -- REQUIRES RESTART
# =============================================================================
buffer:
  memory_limit: 0             # 0 = auto-detect (67% available)
  pressure_threshold: 0.8

# =============================================================================
# Dead Letter Queue -- REQUIRES RESTART
# =============================================================================
# Records that cannot be delivered are routed to the DLQ for later replay. A
# BACKPRESSURED destination is not a delivery failure and never comes here: the
# batch is held instead. `kafka_only` is refused when the output has no bus, so
# a deployment on the direct transport runs with the DLQ off.
# File-only mode writes DLQ entries to local disk as JSON lines.
# Values below are the DEFAULTS scalo applies when the key is absent, except
# `enabled`, which this file turns off. An unparseable value here is FATAL at
# boot (config/mod.rs:191), so `rotation` takes only the two variants named.
dlq:
  enabled: false                  # scalo's own default is true
  # mode: cascade                 # cascade (default), file_only, fan_out, kafka_only
  # file:
  #   path: "/var/spool/dfe/dlq"
  #   rotation: hourly             # hourly (default) or daily -- nothing else
  #   max_age_days: 30
  #   compress_rotated: true

# =============================================================================
# Metrics -- REQUIRES RESTART
# =============================================================================
metrics:
  enabled: true
  address: "0.0.0.0:9090"

# =============================================================================
# Version check (PHONES HOME) -- REQUIRES RESTART
# =============================================================================
# ON BY DEFAULT. At startup the fetcher POSTs its product, version and a
# generated instance id to https://releases.hyperi.io/api/v1/check. Both
# `enabled` and `send_instance_id` default to true, so a deployment that
# never configures this section still calls out.
#
# The defaults come from main.rs and the runtime overlays the version_check
# cascade keys on them. Whether a value written HERE joins that cascade on the
# `--config` path the chart and the container entrypoint take is the open
# question in #69; until it is settled, confirm the opt-out took effect rather
# than assuming it, and treat the network policy as the reliable control.
version_check:
  enabled: true                  # false to stop the startup call
  send_instance_id: true         # false keeps the check, drops the identifier
  # api_url: "https://releases.hyperi.io/api/v1/check"

# =============================================================================
# Cursor Store (incremental fetching)
# =============================================================================
# Tracks the last successful fetch window per source so restarts resume
# from where they left off instead of re-fetching the same time range.
# One file PER KEY under a PVC-backed directory. Persists across pod restarts.
# directory REQUIRES RESTART (cursor store created at startup).
# default_window_hours is HOT-RELOADED. It caps how wide ONE tick's window can
# be, so a source hours behind drains a span per tick instead of asking for the
# whole backlog, and it is the lookback when no cursor exists.
# Unset, the store falls back to the directory holding the config file.
# A tick with no cursor stored, or no cursor store, is a cold start: it counts
# in dfe_fetcher_cursor_cold_start_total{source}, and the first one per source
# logs a WARN (later ones log at DEBUG). An empty store cannot
# tell a new source from a lost cursor (a directory with no volume behind it
# loses every cursor on restart), so alert on cold starts of sources that have
# run before. A cursor read that fails counts in
# dfe_fetcher_cursor_read_failures_total{source} and warns every time.
# on_missing_cursor (hot-reloaded) decides what either does:
#   lookback (default) -- fetch the last default_window_hours: a new source
#                         starts on its own, a lost cursor skips older data
#   refuse             -- fetch nothing and fail the tick until a cursor exists:
#                         a lost cursor never skips data, a new source never starts
# cursor:
#   directory: "/var/lib/dfe-fetcher/cursors"  # REQUIRES RESTART
#   default_window_hours: 1                     # hot-reloaded, caps one tick
#   on_missing_cursor: lookback                 # hot-reloaded: lookback | refuse

# =============================================================================
# Horizontal scaling pressure (scalo engine) -- REQUIRES RESTART
# =============================================================================
# Honoured via the scalo config cascade (run_app reads the `scaling` key).
# The fetcher's inbound is NOT a scalo transport -- it PULLS from cloud APIs
# (aws/azure/gcp/m365/salesforce + the alpha source families) -- so
# transport.inbound is `other` and the engine's compound inbound is 0. Left
# alone the smart default reduces to CPU-only. We therefore push DOMAIN signals
# from the fetch loop and fold them into a CEL pressure here. Both domain
# signals are SELF-NORMALISED (0-1), so NO unguessable per-env target is needed:
#   custom.fetch_pressure = active_fetches / scheduler.max_concurrent_fetches
#   custom.throttle_ratio = throttle_errors / fetch_attempts (HTTP 429 / SlowDown)
# CEL has no max() -- the ternary picks the worse of CPU-vs-domain pressure,
# then the inner ternary picks the worse of the two domain signals. The
# outbound Kafka circuit (set_circuit_open) gates to 0 (more pods won't fix a
# dead sink). Emits dfe_fetcher_scaling_pressure{name="fetch"}.
scaling:
  enabled: true
  memory_gate_threshold: 0.8  # pressure jumps to 100 at this memory ratio

# NOT IMPLEMENTED as at scalo 2.12.1, and previously documented here as if it
# were: scalo's ScalingPressureConfig (scaling/config.rs:28) carries `enabled`
# and `memory_gate_threshold` and nothing else. `interval_secs`, `transport`,
# `params` and `pressures[].expression` are accepted by serde and discarded, so
# a CEL composite written here never runs and emits no gauge. The domain signals
# the fetch loop pushes (fetch_pressure, throttle_ratio) have nowhere to land,
# so deployments scale on CPU. The intent is recorded in #66.

# =============================================================================
# Database sources (sources.db) -- the database shapes of the source framework
# =============================================================================
# Goes UNDER `sources:` alongside `rest:`; shown whole here so it can be
# pasted. One instance per key: an engine, its connection string as a secret
# spec, the block-cursor bounds, and the stores. A `dump` store selects the
# whole result set every tick and lands in the snapshot envelope on
# `<topic>-<unit>` (begin / row / end, rebuilt by `snapshot_id`); a `tail`
# store selects rows past the last committed key tuple in key order, lands
# on `<topic>`, and the checkpoint is written only after the batch is
# acknowledged. A tail reads pages of `limit` rows inside one tick, each
# resuming past the last row of the page before, and ends on the first short
# page or at `max_pages_per_tick`. Every timestamp lands as RFC 3339 UTC, binary as base64,
# NULL as null with the key present. An engine this binary was built
# without (`db-odbc`, `db-clickhouse`, `db-mongodb`) is refused at load.
# The driver each engine needs, its licence and whether the image ships it
# are tabled in docs/reference/db-drivers.md.
#
# sources:
#   db:
#     inventory:
#       enabled: true
#       engine: odbc                    # odbc | clickhouse | mongodb
#       dialect: postgres               # odbc only: postgres | mysql | mssql | oracle | sqlite | snowflake | bigquery | databricks
#       # An ODBC connection string; the driver name is what `odbcinst -q -d`
#       # lists. psqlodbc buffers the whole result set unless it carries
#       # UseDeclareFetch=1 (BoolsAsChar=0 makes booleans JSON booleans);
#       # MariaDB Connector/ODBC likewise unless NO_CACHE=1;FORWARDONLY=1.
#       connection_string: "vault:kv/data/<team>/inventory:odbc_dsn"
#       interval_secs: 3600
#       topic: "inventory"              # dump units land on inventory-hosts, a tail on inventory
#       filter: 'record.alive == true'  # optional CEL over the enveloped row, hot-reloaded
#       batch:
#         max_rows: 5000                # rows per block the cursor fetches
#         max_bytes: 4194304            # transit-buffer bytes per block; 3 x this is the store's memory ceiling
#         max_text_bytes: 65536         # a longer text value fails the tick rather than being truncated
#         max_binary_bytes: 1048576     # likewise for bytea / BLOB
#       stores:
#         - { unit: hosts, shape: dump, query: "SELECT * FROM hosts", row_key: "/id" }
#         # A tail's keys are written into the SQL as given; a case-sensitive
#         # name is delimited in the dialect's own form ('"Ts"', '[Order Date]').
#         - { unit: events, shape: tail, query: "SELECT * FROM events", key: [ts, id], limit: 5000, max_pages_per_tick: 10 }
#     audit:
#       enabled: true
#       engine: clickhouse              # HTTP interface, server-side JSON; a tail binds typed placeholders whose types come from DESCRIBE
#       connection_string: "vault:kv/data/<team>/clickhouse:http_url"   # http[s]://user:password@host:8123/database
#       topic: "audit"
#       stores:
#         - { unit: logins, shape: dump, query: "SELECT * FROM logins", row_key: "/id" }
#         - { unit: access, shape: tail, query: "SELECT * FROM access_log", key: [ts, id], limit: 10000, max_pages_per_tick: 10 }
#     assets:
#       enabled: true
#       engine: mongodb                 # the official driver; a store is a collection, not a query
#       connection_string: "vault:kv/data/<team>/mongo:uri"   # mongodb://user:password@host:27017 or mongodb+srv://...
#       topic: "assets"
#       batch: { max_rows: 1000 }       # documents per driver batch (find batch_size / change-stream batch size)
#       stores:
#         # What this engine needs of a store sits under `mongodb`, so the keys
#         # every engine shares stay one vocabulary. Note `mongodb.filter` is a
#         # query document sent to the server, distinct from the instance-level
#         # `filter` above, which is CEL over each row.
#         # Documents land as relaxed extended JSON: ObjectId as {"$oid": ...}, dates as {"$date": ...}.
#         - { unit: hosts, shape: dump, row_key: "/_id/$oid", mongodb: { database: inventory, collection: hosts, filter: { alive: true } } }
#         # mongodb.tail: change_stream (default) needs a replica set and sees every insert, update and
#         # delete, resumed from the last acknowledged event's resume token; keyset follows _id on a
#         # standalone server and sees inserts only. mongodb.filter matches what the store yields: the
#         # documents of a dump or keyset tail, the change EVENTS of a change stream.
#         - { unit: changes, shape: tail, limit: 5000, mongodb: { database: inventory, collection: hosts } }
#         - { unit: appended, shape: tail, limit: 5000, mongodb: { database: inventory, collection: audit, tail: keyset } }

# =============================================================================
# File sources (sources.file) -- the file shapes of the source framework
# =============================================================================
# Goes UNDER `sources:` alongside `rest:` and `db:`; shown whole here so it
# can be pasted. One instance per key: a topic base, the interval, an optional
# filter, and the units. A `dump` unit reads every file its globs match once,
# oldest change first, and lands EACH FILE as its own snapshot on
# `<topic>-<unit>` (begin / row / end, rebuilt by `snapshot_id`); a tick with
# no new file emits nothing. The done marker is the file's change time,
# committed only after the file's last batch is acknowledged, so a file that
# is rewritten in place is read again and a file dropped in by rename is
# never skipped. A `tail` unit follows its files through rotation and
# truncation, lands each line on `<topic>` with no envelope, and commits its
# byte offsets after the acks; it needs the binary built with `file-tail`
# and is refused at load otherwise. A dump is gzip-inflated by magic
# whatever the file is called.
#
# sources:
#   file:
#     exports:
#       enabled: true
#       interval_secs: 300
#       topic: "exports"                # dump units land on exports-assets, a tail on exports
#       filter: 'record.alive == true'  # optional CEL over the enveloped row, hot-reloaded
#       units:
#         - unit: assets
#           dump:
#             paths: ["/data/exports/**/*.jsonl.gz", "/data/exports/**/*.csv"]
#             decoder: auto             # auto | ndjson | json_array | csv; auto picks by extension (.jsonl/.ndjson, .json, .csv)
#             chunk_bytes: 65536        # bytes read per chunk; one chunk plus the open row is held ahead of the driver
#           row_key: "/id"              # JSON pointer to the row's identity, for the oversize stub
#         - unit: logs
#           tail:
#             include: ["/var/log/app/*.log*"]   # the `*` after `.log` keeps a rotated file in scope
#             exclude: []
#             read_from: beginning      # beginning | end -- where a newly discovered file is read from
#             decoder: ndjson           # ndjson passes each line through; line wraps it as {"line": "..."}
#             max_line_bytes: 102400    # a longer line is dropped and counted
#             glob_minimum_cooldown_ms: 1000
#             rotate_wait_secs: 30      # a rotated file keeps being read this long after it leaves the glob
#             max_tick_secs: 30         # a tick ends by then so its lines can be committed while the files grow
#             fingerprint: { strategy: checksum, bytes: 256, lines: 1, ignored_header_bytes: 0 }   # checksum | device_and_inode
