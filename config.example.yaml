# dfe-fetcher configuration example
# Copy to config.yaml and customise for your environment
#
# Environment variables: DFE_FETCHER_* prefix
# Nesting: DFE_FETCHER_SCHEDULER__DEFAULT_INTERVAL_SECS=300
# Config reload: send SIGHUP to reload

# =============================================================================
# Instance Identity
# =============================================================================
# Auto-derived from source config if omitted.
# Explicit ID recommended for production — prevents cursor key collisions.
# instance_id: "contoso-m365"

# =============================================================================
# Scheduler
# =============================================================================
# Interval and jitter are HOT-RELOADED — changes take effect on next fetch cycle.
# max_concurrent_fetches REQUIRES RESTART (semaphore created at startup).
scheduler:
  default_interval_secs: 300    # 5 minutes — hot-reloaded
  max_concurrent_fetches: 10    # REQUIRES RESTART
  jitter_percent: 10            # Avoid thundering herd — hot-reloaded

# =============================================================================
# Native Sources (Rust-native, maintained in this repo)
# =============================================================================
# Decision: use native source when a good Rust crate exists.
# Otherwise, use a container extractor.

# Sources — filter is HOT-RELOADED (re-evaluated per record).
# enabled, credentials, services, topic REQUIRE RESTART.
sources:
  aws:
    enabled: false              # REQUIRES RESTART
    # region may be a literal value, env:VAR_NAME, or vault:path:key
    region: "us-east-1"
    # access_key_id: ""         # Prefer credential_secret in production
    # secret_access_key: ""
    # assume_role_arn: ""
    # credential_secret: "vault:secret/aws:credentials"
    # interval_secs: 300        # Override default
    services:
      - name: cloudtrail
      - name: guardduty
      - name: securityhub
      - name: config
      # Inspector v2 must be enabled tenant-side; returns empty otherwise.
      # - name: inspector
      #   config:
      #     max_results: 100   # per-page, max 100
      # Health API requires Business / Enterprise On-Ramp / Enterprise support.
      # - name: health
      #   config:
      #     max_results: 100   # per-page, max 100
    topic: "aws"
    # filter: 'eventName != "ConsoleLogin"'  # hot-reloaded
    #
    # Multi-endpoint (GA 2.2): ONE type per pod, MANY connections. The fields
    # above (region/credentials) define a single implicit connection. To poll
    # several accounts of the SAME type from this one pod, list them under
    # `connections` instead -- `services`, `topic`, and `filter` above are
    # shared by all of them, and every connection lands on the one `_land`
    # topic. Each connection needs a stable, unique `id` (it is the cursor key
    # and the metric/log label). Connection fields override the shared defaults
    # above; `interval_secs` may be overridden per connection.
    # connections:
    #   - id: aws-acct-123
    #     region: us-east-1
    #     credential_secret: "vault:secret/dfe/fetcher/aws-acct-123:creds"
    #   - id: aws-acct-456
    #     region: eu-west-1
    #     credential_secret: "vault:secret/dfe/fetcher/aws-acct-456:creds"
    #     interval_secs: 600

  azure:
    enabled: false
    # tenant_id: ""
    # client_id: ""
    # client_secret: ""
    # credential_secret: "vault:secret/azure:credentials"
    # subscription_id: ""
    services:
      - name: activity_log
      - name: defender
      - name: sentinel
      # Entra ID is split into three Graph audit endpoints, each with its own
      # source tag and cursor. Configure the feeds you actually want.
      - name: entra_signins             # graph.microsoft.com/v1.0/auditLogs/signIns
      - name: entra_directory_audits    # graph.microsoft.com/v1.0/auditLogs/directoryAudits
      - name: entra_provisioning        # graph.microsoft.com/v1.0/auditLogs/provisioning
      # Log Analytics KQL queries. Each row of the result becomes one record
      # tagged `azure.log_analytics`. Multiple log_analytics services with
      # different queries can coexist (each gets its own cursor if cursor
      # tracking is enabled at the orchestrator level).
      # - name: log_analytics
      #   config:
      #     workspace_id: "00000000-0000-0000-0000-000000000000"  # GUID
      #     kql: |
      #       SecurityEvent
      #       | where EventID == 4625
      #       | project TimeGenerated, Account, IpAddress, FailureReason
    topic: "azure"
    # filter: 'level == "Critical" || level == "Error"'  # hot-reloaded

  m365:
    enabled: false
    # tenant_id: ""
    # client_id: ""
    # client_secret: ""
    # credential_secret: "vault:secret/m365:credentials"
    services:
      # Office 365 Management Activity API. audit_log covers all 5 OMAP content
      # types by default (Audit.General, Audit.AzureActiveDirectory,
      # Audit.Exchange, Audit.SharePoint, DLP.All). Use service config
      # `content_types: [...]` to opt out of specific feeds.
      - name: audit_log
      # Office Mgmt API Audit.Exchange (per-message audit, not aggregate counts).
      - name: exchange_audit
      # Office Mgmt API DLP.All (raw DLP rule-match events).
      - name: dlp
      # Microsoft Graph security/alerts_v2 (requires SecurityAlert.Read.All).
      - name: alerts
    topic: "m365"
    # filter: 'Workload != "Exchange"'  # hot-reloaded

  github:
    enabled: false
    # Set exactly one of `org` or `enterprise` per fetcher instance.
    # org: "your-github-org"
    # enterprise: "your-enterprise-slug"
    # token: ""                # Personal Access Token, fine-grained PAT,
                               # or GitHub App installation token.
                               # Scope: read:audit_log (org) or
                               #        read:enterprise (enterprise).
    # credential_secret: "vault:secret/github:token"
    services:
      # GitHub audit log. Optional `include` filter (web/git/all).
      - name: audit_log
        config:
          include: "all"        # all | web | git
    topic: "github"
    # filter: 'action != "git.clone"'  # hot-reloaded

  okta:
    enabled: false
    # tenant_url: "https://your-tenant.okta.com"
    # token: ""                # SSWS API token (legacy) or OAuth access token.
    # use_ssws_header: true    # true = Authorization: SSWS <token> (default);
                               # false = Authorization: Bearer <token>.
    # credential_secret: "vault:secret/okta:token"
    services:
      - name: system_log
        # Optional service-side config:
        # config:
        #   filter: 'eventType eq "user.session.start"'   # OData filter
        #   limit: 100                                    # per-page, max 1000
    topic: "okta"
    # filter: 'eventType != "user.session.access_token"'  # hot-reloaded

  cloudflare:
    enabled: false
    # account_id: ""           # 32-char hex from Cloudflare dashboard.
    # token: ""                # API token with "Account Settings: Read" (v1 audit-logs endpoint).
    # credential_secret: "vault:secret/cloudflare:token"
    services:
      - name: audit_logs
        # Optional service-side filters:
        # config:
        #   actor_email: "ops@example.com"   # filter by acting user
        #   action_type: "login"             # filter by action category
        #   per_page: 100                    # default 100, max 1000
    topic: "cloudflare"
    # filter: 'action.type != "view"'  # hot-reloaded

  onepassword:
    enabled: false
    # 1Password Events Reporting API. Requires 1Password Business or
    # Enterprise plan with Events Reporting enabled on the tenant.
    # token: ""                # Bearer token from 1Password Business dash:
                               # Integrations > Directory > Events Reporting.
    # credential_secret: "vault:secret/onepassword:events_token"
    # api_url_override:        # Defaults to https://events.1password.com.
    #                          # EU region: https://events.ent.1password.eu
    services:
      - name: signin_attempts     # /api/v2/signinattempts
      - name: item_usages         # /api/v2/itemusages
      - name: audit_events        # /api/v2/auditevents
    topic: "onepassword"
    # filter: 'category != "miss"'  # hot-reloaded

  crowdstrike:
    enabled: false
    # CrowdStrike Falcon. Set api_url_override to your tenant region:
    #   US-1: https://api.crowdstrike.com (default)
    #   US-2: https://api.us-2.crowdstrike.com
    #   EU-1: https://api.eu-1.crowdstrike.com
    #   US-GOV-1: https://api.laggar.gcw.crowdstrike.com
    # api_url_override: "https://api.crowdstrike.com"
    # client_id: ""            # OAuth2 client ID (Falcon admin console).
    # client_secret: ""        # OAuth2 client secret.
    # credential_secret: "vault:secret/crowdstrike:client_secret"
    services:
      - name: alerts
        # Optional service-side config:
        # config:
        #   limit: 100                 # query page size, max 1000
        #   filter: "severity:>=70"    # extra Falcon Query Language clause
    topic: "crowdstrike"
    # filter: 'severity >= 70'  # hot-reloaded

  slack:
    enabled: false
    # Slack audit logs. Enterprise Grid only - the audit API isn't
    # available on Pro/Business+.
    # token: ""                # xoxa-... or xoxb-... org-admin token with
                               # `auditlogs:read` scope.
    # credential_secret: "vault:secret/slack:audit_token"
    services:
      - name: audit_logs
        # Optional service-side filters:
        # config:
        #   action: "user_login"          # specific action
        #   entity: "user"                # specific entity type
        #   limit: 200                    # per-page, max 1000
    topic: "slack"
    # filter: 'action != "user_login"'  # hot-reloaded

  bitwarden:
    enabled: false
    # Bitwarden Events API. Teams or Enterprise plan required.
    # Cloud or self-hosted (set both URL overrides for self-hosted).
    # client_id: "organization.<uuid>"   # Settings > Organization info > API Key
    # client_secret: ""
    # credential_secret: "vault:secret/bitwarden:client_secret"
    # api_url_override: "https://api.bitwarden.com"
    # identity_url_override: "https://identity.bitwarden.com/connect/token"
    services:
      - name: events
    topic: "bitwarden"
    # filter: 'type < 1500'  # hot-reloaded

  duo:
    enabled: false
    # Duo Admin API. HMAC-SHA1 request signing (Duo's proprietary scheme).
    # api_host: "api-XXXXXXXX.duosecurity.com"   # from Admin > Applications
    # integration_key: ""                        # ikey
    # secret_key: ""                             # skey
    # credential_secret: "vault:secret/duo:skey"
    services:
      - name: authentication_logs
        # config:
        #   limit: 100                # per-page, max 1000
    topic: "duo"
    # filter: 'result == "FRAUD"'  # hot-reloaded

  # ---------------------------------------------------------------------------
  # Public-registry supply-chain audit (no auth required, free public APIs).
  # For each tick the fetcher pulls full metadata for each configured package;
  # downstream tooling computes deltas to detect unexpected publications.
  # ---------------------------------------------------------------------------

  pypi:
    enabled: false
    # packages:
    #   - "hyperi-pylib"
    #   - "hyperi-ci"
    # api_url_override: "https://pypi.org"  # default
    topic: "pypi"
    # filter: 'info.yanked != false'  # hot-reloaded

  crates_io:
    enabled: false
    # crates:
    #   - "hyperi-rustlib"
    #   - "dfe-loader"
    #   - "dfe-fetcher"
    # api_url_override: "https://crates.io"  # default
    topic: "crates_io"
    # filter: 'versions.size() > 0'  # hot-reloaded

  go_modules:
    enabled: false
    # modules:
    #   - "github.com/hyperi-io/some-go-tool"
    # api_url_override: "https://proxy.golang.org"  # default
    topic: "go_modules"
    # filter: 'versions.size() > 0'  # hot-reloaded

  # ---------------------------------------------------------------------------
