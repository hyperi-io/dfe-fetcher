    # filter: 'id.applicationName == "login"'  # hot-reloaded

  # ---------------------------------------------------------------------------
  # GCP Pub/Sub pull
  # ALPHA (code-complete, not production-validated) - additionally pending a
  # hyperi-infra issue (TBD). The fetcher pulls and
  # acknowledges Pub/Sub messages via the REST `:pull` / `:acknowledge`
  # endpoints. Each subscription requires:
  #   1. A Cloud Logging Log Sink (or app publisher) populating a topic.
  #   2. A Pub/Sub subscription on that topic.
  #   3. The fetcher SA granted `roles/pubsub.subscriber` on the subscription.
  # Leave `enabled: false` until the infra issue is closed.
  # ---------------------------------------------------------------------------

  gcp_pubsub:
    enabled: false
    # service_account_key: "/etc/gcp/pubsub-sa.json"
    # credential_secret: "vault:secret/gcp-pubsub:sa_key"
    # api_url_override: "https://pubsub.googleapis.com"  # default
    # token_url_override: "https://oauth2.googleapis.com/token"  # default
    subscriptions:
      # - project_id: "my-gcp-project"
      #   subscription_id: "audit-logs-fetcher"
      #   max_messages: 1000           # default; REST cap is 1000
      #   return_immediately: true     # default; single-shot per tick
    topic: "gcp_pubsub"
    # filter: '_dfe_fetcher_pubsub.subscription.contains("audit")'  # hot-reloaded

  # ---------------------------------------------------------------------------
  # Object-store source family (S3 / GCS / Azure Blob)
  #
  # Polls bucket prefixes for new objects, parses gzipped JSON-lines / JSON /
  # plain text, and emits one record per line. Used for log feeds that only
  # deliver via bucket (CloudTrail, VPC Flow Logs, WAF, Cloud Logging storage
  # sinks, Azure diagnostic-to-blob).
  #
  # Phase 1: S3 backend is fully implemented. GCS and Azure Blob backends are
  # stubs that log-and-skip; do not enable them today. See
  # docs/superpowers/specs/2026-05-21-object-store-source-design.md for the
  # Phase 2 plan.
  #
  # Formats: json_gz | jsonl | json | text_gz | text
  # ---------------------------------------------------------------------------

  object_store:
    enabled: false
    topic: "object_store"
    # filter: '_dfe_fetcher_object.bucket == "my-cloudtrail-bucket"'
    backends:
      # --- S3 example (live) ---
      # - provider: s3
      #   region: ap-southeast-2
      #   access_key_id: "env:AWS_ACCESS_KEY_ID"
      #   secret_access_key: "env:AWS_SECRET_ACCESS_KEY"
      #   # credential_secret: "vault:secret/aws-s3-reader:credentials"
      #   # endpoint_override: "http://localhost:9000"  # for MinIO / R2 / B2
      #   buckets:
      #     - bucket: my-cloudtrail-bucket
      #       prefixes:
      #         - prefix: "AWSLogs/123456789012/CloudTrail/ap-southeast-2/"
      #           format: json_gz
      #           source_tag: "aws_cloudtrail"
      #           # topic: "cloudtrail"   # override the source-level topic
      #         - prefix: "AWSLogs/123456789012/vpcflowlogs/"
      #           format: json_gz
      #           source_tag: "aws_vpc_flow"
      #
      # --- GCS example (PHASE 2 STUB - do not enable today) ---
      # - provider: gcs
      #   service_account_key: "/etc/gcp/sa-key.json"
      #   buckets:
      #     - bucket: my-cloudaudit-export
      #       prefixes:
      #         - prefix: "cloudaudit.googleapis.com/activity/"
      #           format: json_gz
      #           source_tag: "gcp_audit_sink"
      #
      # --- Azure Blob example (PHASE 2 STUB - do not enable today) ---
      # - provider: azure_blob
      #   account: mydiagstorage
      #   account_key: "vault:secret/azure-blob:account-key"
      #   buckets:
      #     - bucket: insights-activity-logs   # blob container
      #       prefixes:
      #         - prefix: "resourceId=.../y=2026/"
      #           format: json_gz
      #           source_tag: "azure_activity_sink"

  # ---------------------------------------------------------------------------
  # Salesforce audit (SetupAuditTrail, LoginHistory, EventLogFile)
  #
  # ALPHA (code-complete, not production-validated) - additionally pending a
  # Salesforce connected app +
  # integration user for live testing (same status as google_workspace and
  # gcp_pubsub). The code is complete but unverified against a live org.
  # Leave `enabled: false` until a connected app is provisioned.
  #
  # Auth is OAuth2 against <login_url>/services/oauth2/token via one of two
  # server-to-server flows, picked by which fields are set:
  #
  #   JWT bearer (recommended): client_id + username + private_key
  #     (or private_key_secret). Upload the matching X.509 cert to the
  #     connected app; pre-authorise the integration user.
  #   client credentials: client_id + client_secret (or credential_secret).
  #     Enable the client-credentials flow on the connected app with a
  #     run-as user.
  #
  # Surface availability:
  #   setup_audit_trail, login_history - every org, no add-on.
  #   event_log_file - 7 event types free (1-day retention); 70+ require the
  #     Event Monitoring / Shield add-on. Two-stage: SOQL lists files, then
  #     each LogFile body is downloaded as CSV.
  #
  # Required perms on the integration user: API Enabled, View Setup Audit
  # Trail, and (for event_log_file) View Event Log Files.
  # ---------------------------------------------------------------------------

  salesforce:
    enabled: false
    # login_url: "https://login.salesforce.com"   # sandbox: https://test.salesforce.com
    # api_version: "v60.0"
    # client_id: "env:SALESFORCE_CLIENT_ID"       # connected app consumer key
    #
    # --- JWT bearer auth ---
    # username: "integration@example.com"
    # private_key_secret: "vault:secret/salesforce:private_key"
    # # private_key: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
    #
    # --- OR client-credentials auth ---
    # client_secret: "env:SALESFORCE_CLIENT_SECRET"
    # # credential_secret: "vault:secret/salesforce:client_secret"
    #
    # instance_url_override: "https://mydomain.my.salesforce.com"  # testing / custom domain
    services:
      # - name: setup_audit_trail
      # - name: login_history
      # - name: event_log_file
      #   config:
      #     interval: "Daily"          # or "Hourly"
      #     event_types: ["Login", "Logout", "ApiTotalUsage", "ReportExport"]
    topic: "salesforce"
    # filter: 'EventType == "Login"'   # hot-reloaded

  gcp:
    enabled: false
    # project_id: ""
    # service_account_key: "/etc/gcp/sa-key.json"
    # credential_secret: "vault:secret/gcp:credentials"
    services:
      # Cloud Audit Logs split into the four subtypes GCP publishes under
      # cloudaudit.googleapis.com. Each gets its own source tag and cursor.
      # data_access is OFF by default at the GCP project level - enable via
      # IAM audit-config before expecting records from that subtype.
      - name: admin_activity            # log_id("cloudaudit.googleapis.com/activity")
      - name: data_access               # log_id("cloudaudit.googleapis.com/data_access")
      - name: system_event              # log_id("cloudaudit.googleapis.com/system_event")
      - name: policy_denied             # log_id("cloudaudit.googleapis.com/policy")
      # Additional Cloud Logging streams. Each requires tenant-side enablement:
      # - vpc_flow_logs: enable VPC Flow Logs per subnet.
      # - dns_queries:   attach a DNS server policy with logging enabled.
      # - storage_access: gcs_bucket subset of data_access; same enablement
      #                   as the data_access service.
      - name: vpc_flow_logs
      - name: dns_queries
      - name: storage_access
      - name: scc
      - name: cloud_logging
    topic: "gcp"
    # filter: 'severity != "INFO"'  # hot-reloaded

# =============================================================================
# External Extractors — ALL REQUIRE RESTART
# =============================================================================
# For tools that don't have good Rust crates — wrap in containers.
# One container per source + config. Can run N instances with different configs.

extractors:
  # Container-based extractors (Docker/podman)
  containers: []
    # Example: CloudWatch metrics via YACE
    # - name: cloudwatch-metrics-prod
    #   image: ghcr.io/nerdswords/yet-another-cloudwatch-exporter:v0.62.0
    #   runtime: docker              # docker or podman
    #   mode: scheduled              # scheduled (one-shot) or continuous
    #   communication: stdout        # stdout (JSON lines) or http (POST)
    #   topic: aws_cloudwatch_land
    #   interval_secs: 300
    #   timeout_secs: 600            # Kill container after this many seconds (scheduled mode)
    #   pull_policy: if-not-present  # always, if-not-present, or never
    #   env:
    #     AWS_REGION: us-east-1
    #     AWS_ACCESS_KEY_ID: "vault:secret/aws:access_key"
    #     AWS_SECRET_ACCESS_KEY: "vault:secret/aws:secret_key"
    #   memory_limit: "512m"
    #   cpu_limit: 0.5
    #   max_restart_attempts: 0      # 0 = unlimited
    #   max_restart_backoff_secs: 60
    #   stable_after_secs: 300

    # Example: Multiple M365 orgs (same tool, different config)
    # - name: m365-org-alpha
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-alpha-uuid"
    #     M365_CLIENT_ID: "client-alpha-uuid"
    #     M365_CLIENT_SECRET: "vault:secret/m365/alpha:client_secret"

    # - name: m365-org-beta
    #   image: internal/m365-extractor:latest
    #   mode: continuous
    #   communication: http
    #   topic: m365_land
    #   env:
    #     M365_TENANT_ID: "tenant-beta-uuid"
    #     M365_CLIENT_ID: "client-beta-uuid"
    #     M365_CLIENT_SECRET: "vault:secret/m365/beta:client_secret"

    # ─── Filebeat sidecar examples ───────────────────────────────────
    # Use Filebeat for log sources that established tools handle well.
    # Each runs as a container extractor — stdout (JSON lines) or HTTP POST.

    # Example: Syslog collection via Filebeat
    # - name: filebeat-syslog
    #   image: docker.elastic.co/beats/filebeat:8.17.0    # REQUIRES RESTART
    #   mode: continuous                                    # REQUIRES RESTART
    #   communication: http                                 # Posts to /ingest/syslog
    #   topic: syslog
    #   env:
    #     FETCHER_INGEST_URL: "http://localhost:8080/ingest/syslog"
    #   volumes:
    #     - "/var/log/syslog:/var/log/syslog:ro"
    #     - "./filebeat-syslog.yml:/usr/share/filebeat/filebeat.yml:ro"
    #   max_restart_attempts: 0
    #   max_restart_backoff_secs: 60

    # Example: Windows event log forwarding
    # - name: filebeat-winevt
    #   image: docker.elastic.co/beats/filebeat:8.17.0
    #   mode: continuous
    #   communication: http
    #   topic: windows_events
    #   volumes:
    #     - "/mnt/winevt:/var/log/winevt:ro"
    #     - "./filebeat-winevt.yml:/usr/share/filebeat/filebeat.yml:ro"

    # Example: Custom application logs (stdout JSON output)
    # - name: filebeat-applog
    #   image: docker.elastic.co/beats/filebeat:8.17.0
    #   mode: continuous
    #   communication: stdout
    #   topic: application_logs
    #   volumes:
    #     - "/var/log/myapp:/var/log/myapp:ro"
    #     - "./filebeat-applog.yml:/usr/share/filebeat/filebeat.yml:ro"
    #   memory_limit: "256m"
    #   cpu_limit: 0.5

  # Vector.dev extractor integration
  vector:
    enabled: false
    grpc_bind_address: "0.0.0.0:6000"
    instances: []
    # - name: syslog-collector
    #   mode: container
    #   image: timberio/vector:latest-alpine
    #   vector_config: |
    #     [sources.syslog]
    #     type = "syslog"
    #     address = "0.0.0.0:514"
    #     [sinks.dfe]
    #     type = "vector"
    #     address = "dfe-fetcher:6000"
    #   topic: syslog_land

# =============================================================================
# Ingest server — REQUIRES RESTART
# =============================================================================
# HTTP server binds at startup; auth token resolved once.
ingest:
  enabled: true
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760     # 10MB
  # auth_token: "vault:secret/dfe:ingest_token"

# =============================================================================
# Output transport — REQUIRES RESTART
# =============================================================================
# Transport connections are established at startup.
# Default: kafka (backward compatible with top-level kafka: section)
#
# Every record goes to the transports under `type` -- its own topic on the bus,
# the configured endpoint on the direct transport. `destinations` declares other
# places a record can go, and `routes` sends matching records there instead: a
# transform, an archiver, or several at once. A backpressured destination HOLDS
# the batch and stalls the scheduler; the cursor does not advance and nothing is
# dead-lettered.
# output:
#   type: kafka            # "kafka" | "grpc" | "both"
#   kafka:
#     profile: production
#     brokers: ["kafka:9092"]
#     client_id: "dfe-fetcher"
#   grpc:
#     endpoint: "http://dfe-loader:6000"
#   destinations:
#     transform_orders:
#       grpc:
#         endpoint: "http://dfe-transform-orders:6000"
#     archiver:
#       grpc:
#         endpoint: "http://dfe-archiver:6000"
#   routes:
#     - match_field: "_source"
#       match_value: "orders"
#       destination: ["transform_orders", "archiver"]

# Kafka — transport config REQUIRES RESTART; topic_suffix is hot-reloaded.
kafka:
  brokers:                        # REQUIRES RESTART
    - "localhost:9092"
  client_id: "dfe-fetcher"       # REQUIRES RESTART
  topic_suffix: "_land"          # hot-reloaded
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: "/etc/ssl/kafka-ca.crt"
  producer:
    batch_size: 8388608       # 8MiB
    batch_messages: 10000
    linger_ms: 20
    compression: "zstd"
    acks: "all"
    retries: 5

# =============================================================================
# Buffer / Memory — REQUIRES RESTART
# =============================================================================
buffer:
  memory_limit: 0             # 0 = auto-detect (67% available)
  pressure_threshold: 0.8

# =============================================================================
# Dead Letter Queue — REQUIRES RESTART
# =============================================================================
# Records that cannot be delivered are routed to the DLQ for later replay. A
# BACKPRESSURED destination is not a delivery failure and never comes here: the
# batch is held instead. `kafka_only` is refused when the output has no bus, so
# a deployment on the direct transport runs with the DLQ off.
# File-only mode writes DLQ entries to local disk as JSON lines.
dlq:
  enabled: false
  # mode: file_only               # file_only (default), cascade, fan_out, kafka_only
  # file:
  #   path: "/var/lib/dfe-fetcher/dlq"
  #   rotation: daily              # daily, hourly, size_mb
  #   max_age_days: 7
  #   compress_rotated: true

# =============================================================================
# Metrics — REQUIRES RESTART
# =============================================================================
metrics:
  enabled: true
  address: "0.0.0.0:9090"

# =============================================================================
# Cursor Store (incremental fetching)
# =============================================================================
# Tracks the last successful fetch window per source so restarts resume
# from where they left off instead of re-fetching the same time range.
# Single JSON file on a PVC-backed path. Persists across pod restarts.
# file_path REQUIRES RESTART (cursor store created at startup).
# default_window_hours is HOT-RELOADED (re-read when no cursor exists).
# cursor:
#   file_path: "/var/lib/dfe-fetcher/cursors.json"  # REQUIRES RESTART
#   default_window_hours: 1                          # hot-reloaded

# =============================================================================
# Horizontal scaling pressure (rustlib 2.8.10+ engine) — REQUIRES RESTART
# =============================================================================
# Honoured via the rustlib config cascade (run_app reads the `scaling` key).
# The fetcher's inbound is NOT a rustlib transport — it PULLS from cloud APIs
# (aws/azure/gcp/m365/salesforce + the alpha source families) — so
# transport.inbound is `other` and the engine's compound inbound is 0. Left
# alone the smart default reduces to CPU-only. We therefore push DOMAIN signals
# from the fetch loop and fold them into a CEL pressure here. Both domain
# signals are SELF-NORMALISED (0-1), so NO unguessable per-env target is needed:
#   custom.fetch_pressure = active_fetches / scheduler.max_concurrent_fetches
#   custom.throttle_ratio = throttle_errors / fetch_attempts (HTTP 429 / SlowDown)
# CEL has no max() — the ternary picks the worse of CPU-vs-domain pressure,
# then the inner ternary picks the worse of the two domain signals. The
# outbound Kafka circuit (set_circuit_open) gates to 0 (more pods won't fix a
# dead sink). Emits dfe_fetcher_scaling_pressure{name="fetch"}.
scaling:
  enabled: true
  interval_secs: 15
  transport:
    inbound: other            # cloud-API pull, not a rustlib transport
    outbound: kafka           # producer (downstream-bound; not in the default max)
  params:
    cpu_target: 0.70
    # NOTE: no lag_target — fetcher has NO kafka INBOUND (it is a producer).
    # NOTE: fetch_pressure + throttle_ratio are self-normalised, so they need
    #       NO target param. Add one ONLY if you switch to an absolute signal.
  pressures:
    - name: fetch
      # 100 * max(cpu/cpu_target, max(fetch_pressure, throttle_ratio)), gated by circuit.
      expression: >
        circuit_open ? 0.0 :
        100.0 * (
          cpu_utilisation_ratio / params.cpu_target >
            (custom.fetch_pressure > custom.throttle_ratio
               ? custom.fetch_pressure : custom.throttle_ratio)
          ? cpu_utilisation_ratio / params.cpu_target
          : (custom.fetch_pressure > custom.throttle_ratio
               ? custom.fetch_pressure : custom.throttle_ratio)
        )
