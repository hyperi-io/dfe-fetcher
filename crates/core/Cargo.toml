# Project:   dfe-fetcher
# File:      crates/core/Cargo.toml
# Purpose:   Source framework core: rows, shapes, batcher, rules, envelope, checkpoints
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher-core"
description = "I/O-free core of the dfe-fetcher source framework: row types, shape trait, batcher, CEL rules, snapshot envelope, checkpoints"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
cel = { workspace = true }
chrono = { workspace = true }
csv-core = { workspace = true }
futures-core = { workspace = true }
itoa = { workspace = true }
memchr = { workspace = true }
scalo = { workspace = true, features = ["expression", "rules"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
# Clock types and a once-cell only: docs/architecture.md "Negative invariants".
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
