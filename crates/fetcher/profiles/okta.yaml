# The SHAPE of the Okta System Log API: no tenant, no token. An instance
# supplies its tenant URL as `base_url` and its credential as an API key
# (`Authorization: SSWS <token>`, Okta's own API-token header), a plain bearer
# (an OAuth access token someone else minted), or the service-app key pair
# Okta's own documentation steers integrations towards -- an API Services app
# whose client-credentials exchange authenticates with a private-key JWT and is
# granted `okta.logs.read` alone, rather than a static token carrying the
# permissions of the admin who minted it. The typed `sources.okta` block maps
# onto an api_key or bearer instance of this profile at load, so its config
# surface is unchanged; the service-app path is configured as a
# `sources.rest` instance naming this profile.
#
# One incremental unit: the scheduler's window becomes `since`/`until` in ISO
# 8601 with millisecond precision and a `Z` zone, oldest first, `limit`
# events per page (Okta caps it at 1000), and an optional server-side
# `filter` in Okta's expression syntax. Pages are a top-level JSON array
# linked by `Link: rel="next"`; the next URL is requested as given, and a
# page that is empty but still links onward is followed.
profile: okta
maturity: alpha
base_url: "{{ vars.base_url }}"
shape: incremental
auth:
  accepts: [api_key, bearer, oauth2_client_credentials]
  api_key:
    header: Authorization
    prefix: "SSWS "
  # The org authorisation server's token endpoint, which is the only one this
  # profile reaches: an instance authenticates the exchange with a signed
  # assertion, because the org server refuses a client secret. Okta caps an
  # assertion at an hour and refuses a `jti` it has already seen, so the
  # assertion is short-lived and every mint carries its own id. An app with a
  # second key pair registered -- what rotating the first looks like -- needs
  # the instance's `private_key_id` to say which one signed.
  oauth2_client_credentials:
    token_url: "{{ base_url }}/oauth2/v1/token"
    scope: okta.logs.read
    client_assertion:
      ttl_secs: 300
headers:
  Accept: application/json
window:
  format: rfc3339_millis
  lookback: 1h
retry:
  never_retry: [401, 403]
# The cheapest authenticated call: the token's own user.
probe:
  path: /api/v1/users/me
# `base_url` has no default: every tenant has its own. An empty `filter` is
# omitted from the request.
vars:
  limit: 100
  filter: ""
endpoints:
  - unit: system_log
    path: /api/v1/logs
    query:
      since: "{{ window.start }}"
      until: "{{ window.end }}"
      limit: "{{ vars.limit }}"
      sortOrder: ASCENDING
      filter: "{{ vars.filter }}"
    rows: { decoder: json_array }
    paginate: { strategy: link_header }
    max_pages: 50
