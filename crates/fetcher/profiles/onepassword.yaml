# The SHAPE of the 1Password Events Reporting API (Business / Enterprise
# with Events Reporting enabled): no token, no tenant. An instance supplies
# the Events Reporting bearer token and may override `api_url` (the EU
# region has its own host). The typed `sources.onepassword` block maps onto
# an instance of this profile at load, so its config surface is unchanged.
#
# Three incremental units, one per event class, all the same POST shape:
# the first call carries the window (`start_time`/`end_time` in RFC 3339
# milliseconds) and a numeric `limit` (1Password caps it at 1000), every
# later call carries the returned `cursor` ALONE, and a page whose
# `has_more` is false is the last even though it still carries a cursor.
# The POST is a read, so it is retried like a GET. A unit's own `limit`
# comes through `units.<name>.vars`.
profile: onepassword
maturity: alpha
base_url: "{{ vars.api_url }}"
shape: incremental
auth:
  accepts: [bearer]
headers:
  Accept: application/json
window:
  format: rfc3339_millis
  lookback: 1h
retry:
  never_retry: [401, 403]
  retry_non_idempotent: true
# Token introspection: 200 with the token's metadata, no event budget spent.
probe:
  path: /api/auth/introspect
vars:
  api_url: "https://events.1password.com"
  limit: 100
defaults:
  method: POST
  body:
    limit: "{{ vars.limit }}"
    start_time: "{{ window.start }}"
    end_time: "{{ window.end }}"
  rows: { decoder: json_at, at: "/items" }
  paginate:
    strategy: cursor
    from: "body:/cursor"
    into: "body_replace:/cursor"
    stop_when: "body.has_more == false"
  max_pages: 50
endpoints:
  - { unit: signin_attempts, path: /api/v2/signinattempts }
  - { unit: item_usages,     path: /api/v2/itemusages }
  - { unit: audit_events,    path: /api/v2/auditevents }
