# The shape of an S/4HANA OData V2 entity set read as an event feed. An instance
# names the host, the service, the entity set and its change timestamp.
# The window is half open: `time_field >= window.start and < window.end`, to the
# second. Each tick also reads `overlap` back from its start, so a row that
# becomes visible after its window closed is read by the next tick, and the
# rows seen twice are delivered twice. An instance sets `window.delay` and
# `window.overlap` for its own system.
# The pager follows `d.__next` verbatim, so the server's own filter, order and
# `$skiptoken` stay intact. `sap-client` goes in a header, which every page
# carries, because a next link may omit it from its query.
# `time_type` is the timestamp's OData type, `datetimeoffset` or `datetime`.
# A date-only property cannot be windowed finer than a day.
profile: s4hana
maturity: stable
base_url: "{{ vars.base_url }}"
shape: incremental
auth:
  accepts: [basic, oauth2_client_credentials]
  oauth2_client_credentials:
    token_url: "{{ base_url }}{{ vars.token_path }}"
    expires_in_fallback_secs: 3600
headers:
  Accept: application/json
window:
  format: "strftime:%Y-%m-%dT%H:%M:%S"
  lookback: 1h
  # A window ends this long before now so a row committed just after its
  # timestamp is still read.
  delay: 5m
  # The next tick reads this far back, so a row visible up to this long after
  # its window closed is still read.
  overlap: 5m
retry:
  never_retry: [401, 403]
# A refusal is `{"error": {"code": ..., "message": {"lang": ..., "value": ...}}}`.
error:
  at: "/error/message/value"
# `base_url`, `service`, `entity_set`, `time_field` and `key_field` have no
# default, so an instance that leaves one out does not bind. `key_field` is
# the tie-break that keeps rows with equal timestamps in a fixed order across
# pages. An empty `sap_client` or `extra_filter` is left out of the request.
vars:
  token_path: /sap/bc/sec/oauth2/token
  time_type: datetimeoffset
  extra_filter: ""
  sap_client: ""
endpoints:
  - unit: entity_set
    path: "/sap/opu/odata/sap/{{ vars.service }}/{{ vars.entity_set }}"
    headers:
      sap-client: "{{ vars.sap_client }}"
    query:
      $format: json
      $orderby: "{{ vars.time_field }} asc,{{ vars.key_field }} asc"
      $filter: "{{ vars.time_field }} ge {{ vars.time_type }}'{{ window.start }}{{ vars.time_type == 'datetimeoffset' ? 'Z' : '' }}' and {{ vars.time_field }} lt {{ vars.time_type }}'{{ window.end }}{{ vars.time_type == 'datetimeoffset' ? 'Z' : '' }}'{{ vars.extra_filter != '' ? ' and (' + vars.extra_filter + ')' : '' }}"
    rows: { decoder: json_at, at: /d/results }
    paginate: { strategy: request_path, from: "body:/d/__next" }
    max_pages: 100
