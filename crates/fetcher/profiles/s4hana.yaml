# Project:   dfe-fetcher
# File:      crates/fetcher/profiles/s4hana.yaml
# Purpose:   SAP S/4HANA OData V2 entity sets as a declarative REST profile
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

# The shape of an S/4HANA OData V2 entity set read as an event feed. An instance
# names the host, the service, the entity set and its change timestamp.
# The window is half open: `time_field >= window.start and < window.end`, to the
# second, so a row is read in exactly one window.
# The pager follows `d.__next` verbatim, so the server's own filter, order and
# `$skiptoken` stay intact.
# `time_type` is the timestamp's OData type, `datetimeoffset` or `datetime`.
# A date-only property cannot be windowed finer than a day.
profile: s4hana
maturity: beta
base_url: "{{ vars.base_url }}"
shape: incremental
auth:
  accepts: [basic, oauth2_client_credentials]
  oauth2_client_credentials:
    token_url: "{{ base_url }}{{ vars.token_path }}"
    expires_in_fallback_secs: 3600
headers:
  Accept: application/json
window:
  format: "strftime:%Y-%m-%dT%H:%M:%S"
  lookback: 1h
  # A row is stamped when it is created and visible when its transaction
  # commits, so a window ends this long before now to let late commits land.
  delay: 5m
retry:
  never_retry: [401, 403]
# A refusal is `{"error": {"code": ..., "message": {"lang": ..., "value": ...}}}`.
error:
  at: "/error/message/value"
# `base_url` has no default: every system has its own host. An empty
# `sap_client`, `key_field` or `extra_filter` is left out of the request.
vars:
  token_path: /sap/bc/sec/oauth2/token
  service: ""
  entity_set: ""
  time_field: ""
  time_type: datetimeoffset
  key_field: ""
  extra_filter: ""
  sap_client: ""
endpoints:
  - unit: entity_set
    path: "/sap/opu/odata/sap/{{ vars.service }}/{{ vars.entity_set }}"
    query:
      $format: json
      sap-client: "{{ vars.sap_client }}"
      $orderby: "{{ vars.time_field }} asc{{ vars.key_field != '' ? ',' + vars.key_field + ' asc' : '' }}"
      $filter: "{{ vars.time_field }} ge {{ vars.time_type }}'{{ window.start }}{{ vars.time_type == 'datetimeoffset' ? 'Z' : '' }}' and {{ vars.time_field }} lt {{ vars.time_type }}'{{ window.end }}{{ vars.time_type == 'datetimeoffset' ? 'Z' : '' }}'{{ vars.extra_filter != '' ? ' and (' + vars.extra_filter + ')' : '' }}"
    rows: { decoder: json_at, at: /d/results }
    paginate: { strategy: request_path, from: "body:/d/__next" }
    max_pages: 100
