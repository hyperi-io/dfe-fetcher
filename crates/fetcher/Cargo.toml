# Project:   dfe-fetcher
# File:      crates/fetcher/Cargo.toml
# Purpose:   The fetcher app: binary plus the library its tests and tooling link
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher"
description.workspace = true
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = [".github/", "docs/", "infra/", "reference/", "benches/"]

[lib]
name = "dfe_fetcher"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "dfe-fetcher"
path = "src/main.rs"

# The PGO workload binary, built only with `pgo-driver`.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints]
workspace = true

[dependencies]
# Always linked, engines and tailer aside: docs/architecture.md "Build graph".
dfe-fetcher-core = { workspace = true }
dfe-fetcher-rest = { workspace = true }
dfe-fetcher-db = { workspace = true }
dfe-fetcher-file = { workspace = true }

scalo = { workspace = true, features = [
    "config",
    "config-reload",
    "logger",
    "metrics",
    "service-metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "transport-grpc-vector-compat",
    "transport-memory",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    "secrets-vault",
    "dlq",
    "dlq-kafka",
    "deployment",
    "config-schema",
    "cli-service",
    "top",
    "expression",
    "scaling",
    "memory",
    "version-check",
    "worker-pool",
] }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# Env layering over an explicit --config file, on scalo's range so one figment resolves.
figment = { version = ">=0.10.19, <0.11", features = ["env"] }

schemars = { workspace = true }

fastrand = "2.5.0"
# memchr and itoa are in the graph already. src/pipeline calls them directly.
memchr = { workspace = true }
itoa = { workspace = true }
parking_lot = { workspace = true }

thiserror = { workspace = true }
anyhow = "1.0.104"

clap = { version = "4.6.7", features = ["derive", "env"] }

tracing = { workspace = true }

metrics = { workspace = true }

axum = { workspace = true }
bytes = { workspace = true }

chrono = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }

sha2 = { workspace = true }
hex = { workspace = true }

tempfile = { workspace = true }

tikv-jemallocator = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tokio-stream = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tokio-test = "0.4.6"
dotenvy = "0.15.7"
wiremock = "0.6.5"
reqwest = { workspace = true, features = ["json", "rustls"] }
# tower has no default features, and the ingest handler tests need `util`.
tower = { version = "0.5.3", features = ["util"] }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
scalo = { workspace = true, features = ["transport-kafka-test-support"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mariadb"] }
metrics-util = { workspace = true }
smallvec = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
aws-lc-rs = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
pgo-driver = []
# db-odbc needs unixODBC and its headers to build: CONTRIBUTING.md "Commands that prove a change".
db-odbc = ["dfe-fetcher-db/odbc"]
db-clickhouse = ["dfe-fetcher-db/clickhouse"]
db-mongodb = ["dfe-fetcher-db/mongodb"]
db-hana = ["dfe-fetcher-db/hana"]
# `file` is a name only: the dump is always built.
file = []
file-tail = ["file", "dfe-fetcher-file/tail"]
full = ["jemalloc", "db-odbc", "db-clickhouse", "db-mongodb", "db-hana", "file-tail"]

[[bench]]
name = "pipeline"
harness = false
