# Project:   dfe-fetcher
# File:      crates/rest/Cargo.toml
# Purpose:   REST shapes of the source framework: profile grammar, auth, pager, decoder, request executor
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher-rest"
description = "REST event-window and dump shapes for the dfe-fetcher source framework: declarative profile grammar, auth modes, pagers, streaming decoders, request executor"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
dfe-fetcher-core = { workspace = true }

async-compression = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
cel = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
itoa = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
opentelemetry-proto = { workspace = true }
percent-encoding = { workspace = true }
prost = { workspace = true }
quick-xml = { workspace = true }
reqsign = { workspace = true }
# sha1 for Duo's legacy scheme, sha2 for every current one.
sha1 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "json", "form", "rustls", "gzip", "brotli", "stream"] }
# config-schema carries the secret marker into the app's config schema.
scalo = { workspace = true, features = ["expression", "secrets", "secrets-vault", "http", "auth", "config-schema"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum = { workspace = true }
aws-lc-rs = { workspace = true }
flate2 = { workspace = true }
metrics-util = { workspace = true }
scalo = { workspace = true, features = ["yaml"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
