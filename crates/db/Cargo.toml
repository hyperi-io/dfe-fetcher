# Project:   dfe-fetcher
# File:      crates/db/Cargo.toml
# Purpose:   Database shapes of the source framework (dump and keyset tail), one engine per feature
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher-db"
description = "Database dump and keyset-tail shapes for the dfe-fetcher source framework; engines are opt-in features"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
dfe-fetcher-core = { workspace = true }

bytes = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
percent-encoding = { workspace = true }
# config-schema carries the secret marker into the app's config schema.
scalo = { workspace = true, features = ["secrets", "secrets-vault", "config-schema"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

# `prompt` (the Windows connection dialog) stays off. unixODBC links dynamically: docs/reference/db-drivers.md.
odbc-api = { version = "30.1.0", default-features = false, features = ["odbc_version_3_80"], optional = true }
arrow-odbc = { version = "27.1.0", optional = true }
# arrow-odbc's own arrow line, with its JSON writer on.
arrow = { version = "60.1.0", default-features = false, features = ["json"], optional = true }
base64 = { workspace = true, optional = true }

# rustls only, never native-tls.
clickhouse = { version = "0.15.3", default-features = false, features = ["lz4", "rustls-tls"], optional = true }
dfe-clickhouse = { version = "0.1.11", default-features = false, features = ["ext"], optional = true }
url = { workspace = true, optional = true }

# Why `aws-auth` is off: docs/reference/db-drivers.md "Authentication". `compat-3-3-0` is demanded once default features are off.
mongodb = { version = "3.10.1", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls-aws-lc", "dns-resolver", "azure-oidc", "gcp-oidc"], optional = true }
# `serde_json-1` lands ObjectIds and dates as JSON, not debug text.
bson = { version = "3.1.0", default-features = false, features = ["serde", "serde_json-1"], optional = true }

# Pure Rust, rustls only. The driver builds its TLS config from rustls's process default provider, which `hana.rs` installs when the build has none.
hdbconnect_async = { version = "0.33.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"], optional = true }

[dev-dependencies]
scalo = { workspace = true, features = ["yaml"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[features]
default = []
# One engine per feature: docs/architecture.md "Build graph".
odbc = ["dep:odbc-api", "dep:arrow-odbc", "dep:arrow", "dep:base64"]
clickhouse = ["dep:clickhouse", "dep:dfe-clickhouse", "dep:url"]
mongodb = ["dep:mongodb", "dep:bson"]
hana = ["dep:hdbconnect_async", "dep:rustls", "dep:base64", "dep:url"]
