# dfe-fetcher Helm chart values
#
# Generated by hyperi-rustlib deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-fetcher
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe/fetcher.yaml)
config:
  ingest:
    bind_address: 0.0.0.0:8080
    enabled: true
  kafka:
    brokers:
    - kafka:9092
    client_id: dfe-fetcher
    producer:
      acks: all
      compression: zstd
    topic_suffix: _land
  metrics:
    address: 0.0.0.0:9090
    enabled: true
  scheduler:
    default_interval_secs: 300
    jitter_percent: 10
    max_concurrent_fetches: 10
  # Horizontal scaling pressure (rustlib 2.8.10+ engine). Fetcher inbound is a
  # cloud-API pull (transport.inbound=other) so the smart default is CPU-only
  # unless domain signals are folded in. Both custom signals are self-normalised
  # (0-1) -- no per-env target needed. Emits dfe_fetcher_scaling_pressure{name=fetch}.
  scaling:
    enabled: true
    interval_secs: 15
    transport:
      inbound: other
      outbound: kafka
    params:
      cpu_target: 0.70
    pressures:
    - name: fetch
      expression: >
        circuit_open ? 0.0 :
        100.0 * (
          cpu_utilisation_ratio / params.cpu_target >
            (custom.fetch_pressure > custom.throttle_ratio
               ? custom.fetch_pressure : custom.throttle_ratio)
          ? cpu_utilisation_ratio / params.cpu_target
          : (custom.fetch_pressure > custom.throttle_ratio
               ? custom.fetch_pressure : custom.throttle_ratio)
        )
  sources:
    aws:
      enabled: false
      region: us-east-1
      topic: aws
    azure:
      enabled: false
      topic: azure
    gcp:
      enabled: false
      topic: gcp
    m365:
      enabled: false
      topic: m365

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- aws credentials
aws:
  existingSecret: ""
  secretKeys:
    access-key-id: aws-access-key-id
    secret-access-key: aws-secret-access-key
  access-key-id: ""
  secret-access-key: ""

# -- azure credentials
azure:
  existingSecret: ""
  secretKeys:
    client-id: azure-client-id
    client-secret: azure-client-secret
  client-id: ""
  client-secret: ""

# -- m365 credentials
m365:
  existingSecret: ""
  secretKeys:
    client-id: m365-client-id
    client-secret: m365-client-secret
  client-id: ""
  client-secret: ""

# -- gcp credentials
gcp:
  existingSecret: ""
  secretKeys:
    service-account-key: gcp-service-account-key
  service-account-key: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  # dfe-fetcher is a producer (no consumer group) -- no Kafka lag scaler.
  # CPU is the always-on baseline trigger; scalingPressure below is the rich
  # opt-in signal.
  cpu:
    # -- CPU utilisation percentage threshold
    threshold: "80"
  # -- Scale on the rustlib horizontal scaling-pressure engine gauge
  # (dfe_fetcher_scaling_pressure{name="fetch"}), a 0-100 correlated composite
  # of CPU + the fetcher's self-normalised domain signals (fetch backlog +
  # upstream throttle). Opt-in: requires a Prometheus reachable from KEDA.
  # NOTE: serverAddress is CLUSTER-SPECIFIC -- set it to your in-cluster
  # Prometheus before enabling. Use avg()+Value for a composite ratio gauge
  # (NEVER sum() a ratio). Disabled by default.
  scalingPressure:
    enabled: false
    # -- In-cluster Prometheus query endpoint (CLUSTER-SPECIFIC -- must be set).
    serverAddress: ""
    # -- Scale-out when the composite pressure gauge exceeds this (0-100).
    threshold: "70"
    # -- Activation threshold (wake from zero).
    activationThreshold: "1"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
