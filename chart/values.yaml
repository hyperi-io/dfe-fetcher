# dfe-fetcher Helm chart values
#
# Generated by hyperi-rustlib deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-fetcher
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe/fetcher.yaml)
config:
  ingest:
    bind_address: 0.0.0.0:8080
    enabled: true
  kafka:
    brokers:
    - kafka:9092
    client_id: dfe-fetcher
    producer:
      acks: all
      compression: zstd
    topic_suffix: _land
  metrics:
    address: 0.0.0.0:9090
    enabled: true
  scheduler:
    default_interval_secs: 300
    jitter_percent: 10
    max_concurrent_fetches: 10
  sources:
    aws:
      enabled: false
      region: us-east-1
      topic: aws
    azure:
      enabled: false
      topic: azure
    gcp:
      enabled: false
      topic: gcp
    m365:
      enabled: false
      topic: m365

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- aws credentials
aws:
  existingSecret: ""
  secretKeys:
    access-key-id: aws-access-key-id
    secret-access-key: aws-secret-access-key
  access-key-id: ""
  secret-access-key: ""

# -- azure credentials
azure:
  existingSecret: ""
  secretKeys:
    client-id: azure-client-id
    client-secret: azure-client-secret
  client-id: ""
  client-secret: ""

# -- m365 credentials
m365:
  existingSecret: ""
  secretKeys:
    client-id: m365-client-id
    client-secret: m365-client-secret
  client-id: ""
  client-secret: ""

# -- gcp credentials
gcp:
  existingSecret: ""
  secretKeys:
    service-account-key: gcp-service-account-key
  service-account-key: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "5000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: false
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
