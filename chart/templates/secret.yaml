type: Opaque
data:
  {{ .Values.azure.secretKeys.client-id }}: {{ .Values.azure.client-id | b64enc | quote }}
  {{ .Values.azure.secretKeys.client-secret }}: {{ .Values.azure.client-secret | b64enc | quote }}
{{- end }}
