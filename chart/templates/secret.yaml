type: Opaque
data:
  {{ (index .Values.m365.secretKeys "client-id") }}: {{ (index .Values.m365 "client-id") | b64enc | quote }}
  {{ (index .Values.m365.secretKeys "client-secret") }}: {{ (index .Values.m365 "client-secret") | b64enc | quote }}
{{- end }}
---
{{- if not .Values.gcp.existingSecret }}
apiVersion: v1
kind: Secret
