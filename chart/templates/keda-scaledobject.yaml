{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "dfe-fetcher.fullname" . }}
  labels:
    {{- include "dfe-fetcher.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "dfe-fetcher.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    # dfe-fetcher is a PRODUCER (cloud-API pull -> Kafka): it has no consumer
    # group, so there is no consumer-group lag to scale on. CPU is the always-on
    # baseline trigger; the rustlib scaling-pressure composite (CPU + the
    # fetcher's self-normalised fetch-backlog + upstream-throttle signals) is the
    # rich opt-in trigger below.
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.cpu.threshold | quote }}
    {{- if .Values.keda.scalingPressure.enabled }}
    # Horizontal scaling-pressure engine (rustlib): correlated composite of CPU
    # + the fetcher's self-normalised domain signals (fetch backlog + throttle).
    # avg()+Value -- this is a 0-100 composite, NOT a per-partition lag.
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: {{ required "keda.scalingPressure.serverAddress is cluster-specific and must be set" .Values.keda.scalingPressure.serverAddress | quote }}
        metricName: dfe_fetcher_scaling_pressure
        query: avg(dfe_fetcher_scaling_pressure{name="fetch"})
        threshold: {{ .Values.keda.scalingPressure.threshold | quote }}
        activationThreshold: {{ .Values.keda.scalingPressure.activationThreshold | quote }}
    {{- end }}
{{- end }}
