# Project:   dfe-fetcher
# File:      deny.toml
# Purpose:   cargo-deny configuration for license and advisory checks
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[graph]
targets = []
all-features = true

[advisories]
# GHSA-w9wp-h8wv-79jx / CVE-2026-48504 is not listed here because cargo-deny
# never sees it: it is a GitHub advisory with no RustSec entry, so an `ignore`
# would be inert. opentelemetry_sdk 0.31.0 is in the lock through scalo and is
# in the affected range (<= 0.32.0, fixed in 0.32.1). The flaw is in
# `BaggagePropagator::extract_with_context`, which parses an inbound W3C
# Baggage header before enforcing its size limits. Nothing here reaches it:
# neither this workspace nor scalo names `baggage`, and neither installs a text
# map propagator, so the function is never called. Raising the floor needs
# scalo to move first.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
wildcards = "deny"
# The workspace crates are path-only and publish = false, so they carry no version requirement.
allow-wildcard-paths = true
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
