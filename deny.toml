# Project:   dfe-fetcher
# File:      deny.toml
# Purpose:   cargo-deny configuration for license and advisory checks
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[graph]
targets = []
all-features = true

[advisories]
# GHSA-w9wp-h8wv-79jx has no RustSec entry, so it is ignored in .hyperi-ci.yaml, not here.
ignore = [
    { id = "GHSA-qwgh-2vcv-g2f7", reason = "Reached only through the lock: digest 0.10 <- sha2 <- termwiz <- ratatui-termwiz <- ratatui <- scalo, and ratatui's termwiz feature is never enabled, so no build compiles it. Drop when the lock stops carrying digest 0.10, which the digest 0.11 move does." },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained, not vulnerable. It arrives only through testcontainers, via the testcontainers-modules dev-dependency the integration tests use, and no release binary links it. testcontainers 0.28.0 still depends on it. Drop when testcontainers moves off it." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
wildcards = "deny"
# The workspace crates are path-only and publish = false, so they carry no version requirement.
allow-wildcard-paths = true
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
