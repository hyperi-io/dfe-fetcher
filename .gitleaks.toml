# Project-specific gitleaks allowlist
# Extends the CI base configuration (ci/.gitleaks.toml)
#
# The CI runs gitleaks to detect secrets in your code. This file lets you
# exclude false positives specific to your project.
#
# Documentation: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

# Paths to exclude from scanning (regex patterns)
paths = [
    # Git submodules (have their own scanning)
    '''(^|/)ci/''',
    '''(^|/)ai/''',
    # Uncomment and customise as needed
    # '''tests/.*\.py''',
    # '''tests/fixtures/.*''',
    # '''.env.example''',
]

# Regex patterns for known false positives
regexes = [
    # Historical Duo HMAC-SHA1 test fixture (random 40-char string used as
    # the `skey` input to verify sign_hex stability and length). Replaced
    # in a later commit with a low-entropy placeholder, but git history
    # still contains the high-entropy version which `generic-api-key` flags.
    '''Zh5eGmUq9zpfQnyUIu5OL9iWoMMv5ZNmk3zLJ4Ep''',
    # Public Microsoft resource App ID documented in the M365 cloud-setup
    # guide (Office 365 Management API) - a fixed, well-known identifier,
    # not a secret. `generic-api-key` flags it on entropy.
    '''c5393580-f805-4401-95e8-94b7a6ef2fc2''',
    # Placeholder private key in cloud-setup guides: the literal ellipsis
    # form `-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----`
    # shown as a config example, not a real key.
    '''-----BEGIN PRIVATE KEY-----\\n\.\.\.''',
]

# Stopwords - findings containing these are likely false positives
stopwords = ["example", "sample", "test", "mock", "fake", "dummy", "placeholder"]
