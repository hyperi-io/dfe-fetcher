# Project gitleaks allowlist: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

paths = [
    # Git submodules, scanned in their own repos.
    '''(^|/)ci/''',
    '''(^|/)ai/''',
]

regexes = [
    # A Duo HMAC test fixture still in git history.
    '''Zh5eGmUq9zpfQnyUIu5OL9iWoMMv5ZNmk3zLJ4Ep''',
    # The public Office 365 Management API app id, in the M365 guide.
    '''c5393580-f805-4401-95e8-94b7a6ef2fc2''',
    # The ellipsis placeholder key in the cloud-setup guides.
    '''-----BEGIN PRIVATE KEY-----\\n\.\.\.''',
]

stopwords = ["example", "sample", "test", "mock", "fake", "dummy", "placeholder"]
