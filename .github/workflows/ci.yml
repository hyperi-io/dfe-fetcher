name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      from-head:
        type: boolean
        default: true
        description: "Release/retry from HEAD (CI creates the tag). Uncheck to publish an existing tag."
      bump:
        type: choice
        default: auto
        options: [auto, patch, minor]
        description: "Version bump for from-head dispatch"
      tag:
        type: string
        required: false
        description: "Existing tag to publish (only when from-head is unchecked)"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head && 'true' || '' }}
      bump: ${{ inputs.bump || 'auto' }}
    secrets: inherit
