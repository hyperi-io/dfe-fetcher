language: rust

quality:
  enabled: true

test:
  enabled: true
  rust:
    tier: all

build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    features: all
    targets: []

publish:
  enabled: true
  target: both
  binaries: both
