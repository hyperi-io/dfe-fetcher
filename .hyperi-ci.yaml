language: rust

# Feature sets are listed explicitly rather than `all`. The database GRAMMAR
# (`sources.db`) is in the default build, so a config naming an engine this
# binary lacks is refused at load; the ENGINES are features. `db-clickhouse`,
# `db-mongodb` and `file-tail` are pure Rust and their tests need only Docker,
# so they are built and tested here -- without them CI compiles none of the
# database or file-tail proofs and clippy never reads those engines.
#
# `db-odbc` is absent on purpose: it links unixODBC (`libodbc.so.2`) and its
# tests need `unixodbc-dev`, `odbc-postgresql` and `odbc-mariadb` installed on
# the runner. This config cannot declare apt packages, so a runner asked for it
# fails at link time; it joins the lists when the runner image carries those
# packages. Never ask a runner for `--all-features`.
quality:
  enabled: true
  rust:
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,file-tail"

test:
  enabled: true
  rust:
    tier: all
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,file-tail"

build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    # What the release image ships. Without an engine here, a `sources.db` or
    # `file-tail` config is refused at load by a binary that never compiled it.
    # `db-odbc` stays out: it needs `libodbc2` and a driver package per engine
    # in the runtime image, which is a Dockerfile change, not a feature flag.
    features:
      - "jemalloc"
      - "db-clickhouse"
      - "db-mongodb"
      - "file-tail"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

release:
  enabled: true
