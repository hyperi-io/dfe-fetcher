language: rust

quality:
  enabled: true

test:
  enabled: true
  rust:
    tier: all

build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    features: all
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Release-track build optimisation (hyperi-ci Tier 1/2).
    # Channel-gated defaults apply automatically:
    #   spike/alpha → jemalloc + thin LTO
    #   beta        → jemalloc + fat LTO
    #   release     → jemalloc + fat LTO + PGO/BOLT (opt-in below)
    # See hyperi-ci's docs/RUST-RELEASE-TRACK-OPTIMISATION.md for the full
    # contract, and TODO.md → Tier 2 for the workload contract.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

publish:
  enabled: true
  target: both
  binaries: both
