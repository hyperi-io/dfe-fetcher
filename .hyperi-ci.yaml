# HyperI CI Configuration
# Generated by: attach.sh
# Documentation: https://github.com/hyperi-io/ci/blob/main/docs/CONFIGURATION.md
#
# Configuration precedence (highest wins):
#   1. Environment variables (HYPERCI_*)
#   2. This file (.hyperi-ci.yaml)
#   3. ci/defaults.yaml (CI defaults)

# Project language (auto-detected if not specified)
# Values: python, typescript, golang, rust, none
language: rust

# Quality checks
quality:
  enabled: true
  # rust:
  #   clippy: blocking       # Clippy linting
  #   fmt: blocking          # cargo fmt --check
  #   audit: warn            # cargo audit (security vulnerabilities)
  #   deny: warn             # cargo deny (licenses, advisories)

# Testing
# IMPORTANT: Always run local build first to catch issues faster:
#   cargo fmt --check && cargo clippy --all-features && cargo test --all-features
test:
  enabled: true
  coverage: false          # Set to true if using cargo-llvm-cov
  # min_coverage: 80       # Fail if coverage below this percentage
  rust:
    tier: all              # "unit", "integration", "e2e", or "all"
    # Rust test tiers:
    # - unit: tests in src/ (cargo test --lib)
    # - integration: tests in tests/ (cargo test --test '*')
    # - e2e: tests matching tests/e2e* (cargo test --test 'e2e*')

# Building
build:
  enabled: true
  strategies:
    - native               # Release build
  rust:
    features: all          # "all" (--all-features), "default", or comma-separated
    targets: []            # Cross-compile targets (empty = native only)

# Publishing (on release)
publish:
  enabled: true
  # registry: hyperi       # JFrog Cargo registry name
