classification: product

language: rust

# Feature sets are listed explicitly rather than `all`. The database GRAMMAR
# (`sources.db`) is in the default build, so a config naming an engine this
# binary lacks is refused at load; the ENGINES are features. `db-clickhouse`,
# `db-mongodb` and `file-tail` are pure Rust and their tests need only Docker,
# so they are built and tested here -- without them CI compiles none of the
# database or file-tail proofs and clippy never reads those engines.
#
# `db-odbc` links unixODBC (`libodbc.so.2`). hyperi-ci installs `unixodbc-dev`
# for it, so quality lints it. Its tests also need the `odbc-postgresql` and
# `odbc-mariadb` drivers, which the runner lacks, so the test lists leave it
# out. Never ask a runner for `--all-features`.
quality:
  enabled: true
  # The docs lint clean, so a new warning fails the run rather than piling up.
  markdownlint: blocking
  # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 is in the
  # lock through scalo, in the affected range (<= 0.32.0, fixed in 0.32.1). The
  # flaw is in BaggagePropagator::extract_with_context, which parses an inbound
  # W3C Baggage header before enforcing its size limits. Nothing here reaches
  # it: neither this workspace nor scalo registers a Baggage or any other text
  # map propagator. Accepted as unreachable in the DFE threat model (dfe-infra
  # docs/THREAT-MODEL.md, accepted risks). scalo stays on the 0.31 line until
  # metrics-exporter-opentelemetry, at 0.2.1 requiring opentelemetry ^0.31,
  # moves: hyperi-io/scalo-rs#281. deny.toml carries no ignore because it is a
  # GitHub advisory with no RustSec entry, so only osv-scanner sees it.
  ignore:
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator registered in dfe-fetcher or scalo. Accepted risk per dfe-infra docs/THREAT-MODEL.md. Drop when hyperi-io/scalo-rs#281 moves scalo off opentelemetry 0.31, blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31."
  rust:
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,file-tail"
      - "db-odbc"

test:
  enabled: true
  rust:
    # Required, not auto: the tests that set `SSL_CERT_FILE` or a credential's
    # env var rely on one process per test, which only nextest gives.
    nextest: true
    tier: all
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,file-tail"
  # A release runs the full tier. docs/testing.md says which tests are which.
  full:
    required_for_release: true
    rust:
      # The live-provider suites need tenant credentials no runner holds.
      filter: "not (test(/^smoke_remote::/) | test(/^runzero::/))"

build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    # librdkafka, OpenSSL, zstd and zlib link from hyperi-ci's static prefix,
    # so the image installs none of them. rdkafka keeps `dynamic-linking`.
    static_libs: true
    optimize:
      pgo:
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
    # What the release image ships. Without an engine here, a `sources.db` or
    # `file-tail` config is refused at load by a binary that never compiled it.
    # `db-odbc` stays out: it needs `libodbc2` and a driver package per engine
    # in the runtime image, which is a Dockerfile change, not a feature flag.
    features:
      - "jemalloc"
      - "db-clickhouse"
      - "db-mongodb"
      - "file-tail"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Release (where the artefacts go). The thin chart is assembled from the
# emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.20"
