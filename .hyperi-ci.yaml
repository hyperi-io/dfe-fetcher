classification: product

language: rust

# Why the feature sets are explicit: CONTRIBUTING.md "Commands that prove a change".
quality:
  enabled: true
  markdownlint: blocking
  rust:
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,db-hana,file-tail"
      - "db-odbc"

test:
  enabled: true
  rust:
    # Tests that set an env var need nextest's one process per test.
    nextest: true
    tier: all
    features:
      - "default"
      - "jemalloc"
      - "db-clickhouse,db-mongodb,db-hana,file-tail,db-odbc"
  # Test tiers: docs/testing.md.
  full:
    required_for_release: true
    rust:
      # The live-provider suites need tenant credentials no runner holds.
      filter: "not (test(/^smoke_remote::/) | test(/^runzero::/) | test(/^hana::/))"

build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    # librdkafka, OpenSSL, zstd and zlib link from hyperi-ci's static prefix.
    static_libs: true
    optimize:
      pgo:
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
    # What the release image ships, and why unixODBC alone links dynamically: docs/reference/db-drivers.md.
    features:
      - "jemalloc"
      - "db-odbc"
      - "db-clickhouse"
      - "db-mongodb"
      - "db-hana"
      - "file-tail"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

release:
  enabled: true
  candidates: true
  # Moves with the scalo version in Cargo.toml: CONTRIBUTING.md "What tends to bite".
  helm:
    enabled: true
    contract: emit
    library: "2.14.40"
