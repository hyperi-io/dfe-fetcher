        items:
          $ref: '#/$defs/BitwardenService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: bitwarden
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple Bitwarden organisations of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/BitwardenConnection'
  BitwardenService:
    description: Bitwarden service to fetch data from.
    type: object
    properties:
      name:
        description: Service name (currently only "events").
        type: string
      config:
        description: Service-specific configuration. No recognised keys yet.
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  BitwardenConnection:
    description: |-
      One Bitwarden connection: an organisation + its API credentials. Type-wide
      fields (`services`, `topic`, `filter`) are shared and stay on
      [`BitwardenSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      client_id:
        description: Organisation API client ID (`organization.<uuid>`).
        type:
        - string
        - 'null'
      client_secret:
        description: Organisation API client secret (always redacted on serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: Secret source spec for the client_secret ("provider:path:key").
        type:
        - string
        - 'null'
      api_url_override:
        description: API base override.
        type:
        - string
        - 'null'
      identity_url_override:
        description: Identity/token endpoint override.
        type:
        - string
        - 'null'
      interval_secs:
        description: Per-connection fetch-interval override in seconds.
        type:
        - integer
        - 'null'
