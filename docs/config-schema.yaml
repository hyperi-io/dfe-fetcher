        description: |-
          If `true`, send the token as `Authorization: SSWS <token>` (Okta's
          legacy API-token header). If `false`, send as `Authorization: Bearer
          <token>` (OAuth access token). Default: `true`.
        type: boolean
        default: true
      credential_secret:
        description: Secret source spec for the token (e.g. `vault:secret/okta:token`).
        type:
        - string
        - 'null'
      api_url_override:
        description: API base override for testing.
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/OktaService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: okta
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple tenants of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/OktaConnection'
  OktaService:
    description: Okta service to fetch data from.
    type: object
    properties:
      name:
        description: Service name (currently only "system_log").
        type: string
      config:
        description: |-
          Service-specific configuration. Recognised keys for `system_log`:
          - `filter`: OData-style filter applied server-side
            (e.g. `eventType eq "user.session.start"`).
          - `limit`: per-page size (Okta caps at 1000).
