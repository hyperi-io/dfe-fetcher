      connections:
        description: |-
          Multiple tenants/subscriptions of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/AzureConnection'
  AzureService:
    description: Azure service to fetch data from.
    type: object
