      client_secret:
        description: Organisation API client secret. Always redacted on serialisation.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: |-
          Secret source spec for the client_secret
          (e.g. `vault:secret/bitwarden:client_secret`).
        type:
        - string
        - 'null'
      api_url_override:
        description: |-
          API base override (default `https://api.bitwarden.com`).
          Self-hosted: `https://your-host/api`.
        type:
        - string
        - 'null'
      identity_url_override:
        description: |-
          Identity/token endpoint override
          (default `https://identity.bitwarden.com/connect/token`).
          Self-hosted: `https://your-host/identity/connect/token`.
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
