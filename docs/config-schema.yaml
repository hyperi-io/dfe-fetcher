  CrowdstrikeSourceConfig:
    description: |-
      CrowdStrike Falcon source configuration.

      Pulls detections, incidents, and host data from CrowdStrike Falcon's
      public API via OAuth2 client_credentials. Region-aware: each Falcon
      instance lives on a different cloud (US-1, US-2, EU-1, US-GOV-1) and
      the API host changes accordingly.
    type: object
    properties:
      enabled:
        description: Enable CrowdStrike source.
        type: boolean
        default: false
      api_url_override:
        description: |-
          API base URL for the region the tenant lives on.
          Examples:
          - US-1: `https://api.crowdstrike.com` (default)
          - US-2: `https://api.us-2.crowdstrike.com`
          - EU-1: `https://api.eu-1.crowdstrike.com`
          - US-GOV-1: `https://api.laggar.gcw.crowdstrike.com`
        type:
        - string
        - 'null'
      client_id:
        description: OAuth2 client ID (Falcon API client, created in Falcon admin console).
        type:
        - string
        - 'null'
      client_secret:
        description: OAuth2 client secret. Always redacted on serialisation.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: |-
          Secret source spec for the client_secret
          (e.g. `vault:secret/crowdstrike:client_secret`).
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/CrowdstrikeService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: crowdstrike
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple Falcon tenants of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/CrowdstrikeConnection'
  CrowdstrikeService:
    description: CrowdStrike service to fetch data from.
    type: object
    properties:
      name:
        description: |-
          Service name (currently only "detections" - returns enriched
          EPP detection summaries).
        type: string
      config:
        description: |-
          Service-specific configuration. Recognised keys for `detections`:
          - `limit`: query page size (default 100, max 9999).
          - `filter`: Falcon Query Language clause appended to the auto-built
            `created_timestamp:>'<start>'+created_timestamp:<'<end>'`.
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  CrowdstrikeConnection:
    description: |-
      One CrowdStrike connection: a Falcon tenant (region + OAuth2 client). Type-
      wide fields (`services`, `topic`, `filter`) are shared and stay on
      [`CrowdstrikeSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      api_url_override:
        description: API base URL for the region the tenant lives on.
        type:
        - string
        - 'null'
      client_id:
        description: OAuth2 client ID (Falcon API client).
        type:
        - string
        - 'null'
      client_secret:
        description: OAuth2 client secret (always redacted on serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: Secret source spec for the client_secret ("provider:path:key").
        type:
        - string
        - 'null'
      interval_secs:
