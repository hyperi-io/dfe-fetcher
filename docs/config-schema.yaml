  DuoSourceConfig:
    description: |-
      Duo Admin API source configuration.

      Pulls authentication events from a Duo tenant's
      `api-XXXXXXXX.duosecurity.com/admin/v2/logs/authentication` endpoint.
      Auth uses Duo's proprietary scheme: HMAC-SHA1 over a canonical request
      signature, transported in a Basic auth header.
    type: object
    properties:
      enabled:
        description: Enable Duo source.
        type: boolean
        default: false
      api_host:
        description: |-
          API hostname (without scheme). Format: `api-XXXXXXXX.duosecurity.com`.
          Available in the Duo Admin Panel under Applications > Admin API.
        type:
        - string
        - 'null'
      integration_key:
        description: Integration key (`ikey`). Identifies the Admin API integration.
        type:
        - string
        - 'null'
      secret_key:
        description: |-
          Secret key (`skey`). Used to compute the HMAC-SHA1 request signature.
          Always redacted on serialisation.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: |-
          Secret source spec for the secret_key
          (e.g. `vault:secret/duo:skey`).
        type:
        - string
        - 'null'
      api_url_override:
        description: |-
          API base override for testing (full URL incl. scheme). Production
          should use `api_host` only; this is for mock servers.
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/DuoService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: duo
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple Duo tenants of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/DuoConnection'
  DuoService:
    description: Duo service to fetch data from.
    type: object
    properties:
      name:
        description: Service name (currently only "authentication_logs").
        type: string
      config:
        description: |-
          Service-specific configuration. Recognised keys for
          `authentication_logs`:
          - `limit`: per-page size (default 100, max 1000).
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  DuoConnection:
    description: |-
      One Duo connection: a tenant (api_host) + its integration/secret keys.
      Type-wide fields (`services`, `topic`, `filter`) are shared and stay on
      [`DuoSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      api_host:
        description: API hostname (without scheme).
        type:
        - string
        - 'null'
      integration_key:
        description: Integration key (`ikey`).
        type:
        - string
        - 'null'
      secret_key:
        description: Secret key (`skey`) (always redacted on serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: Secret source spec for the secret_key ("provider:path:key").
        type:
        - string
        - 'null'
      api_url_override:
        description: API base override for testing.
        type:
        - string
        - 'null'
      interval_secs:
        description: Per-connection fetch-interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
    required:
    - id
  PypiSourceConfig:
    description: |-
      PyPI source configuration.

      Fetches metadata for a configured list of PyPI packages on each tick.
      Use case: supply-chain monitoring of HyperI-published Python packages -
      downstream tooling computes deltas against a known-good baseline and
      alerts on unexpected version, file, or maintainer changes.

      No authentication required - all responses come from
      `https://pypi.org/pypi/<package>/json`.
    type: object
    properties:
      enabled:
        description: Enable PyPI source.
        type: boolean
        default: false
      packages:
        description: Package names to monitor. Each becomes one record per fetch tick.
        type: array
        items:
          type: string
        default: []
      api_url_override:
        description: API base override for testing (default `https://pypi.org`).
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      topic:
        description: Output Kafka topic.
        type: string
        default: pypi
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
  CratesIoSourceConfig:
    description: |-
      crates.io source configuration.

      Fetches metadata for a configured list of crates on each tick.
      No authentication required - all responses come from
      `https://crates.io/api/v1/crates/<name>`.
    type: object
    properties:
      enabled:
        description: Enable crates.io source.
        type: boolean
        default: false
      crates:
        description: Crate names to monitor.
        type: array
        items:
          type: string
        default: []
      api_url_override:
        description: API base override for testing (default `https://crates.io`).
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      topic:
        description: Output Kafka topic.
        type: string
        default: crates_io
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
  GoModulesSourceConfig:
    description: |-
      Go module-proxy source configuration.

      Fetches version list + per-version `.info` metadata for a configured list
      of Go modules. The default proxy is Google's at
      `https://proxy.golang.org` - free for everyone, GOPROXY-compatible.

      No authentication required.
    type: object
    properties:
      enabled:
        description: Enable Go modules source.
        type: boolean
        default: false
      modules:
        description: Module paths to monitor (e.g. `github.com/hyperi-io/dfe-loader`).
        type: array
        items:
          type: string
        default: []
      api_url_override:
        description: |-
          Module proxy base override (default `https://proxy.golang.org`).
          Use an internal mirror if desired.
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      topic:
        description: Output Kafka topic.
        type: string
        default: go_modules
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
  GoogleWorkspaceSourceConfig:
    description: |-
      Google Workspace Reports API source configuration.

      **Alpha** (code-complete, not production-validated) and additionally
      pending hyperi-infra#5. The fetcher code is written
      against the documented Workspace Reports API but cannot be live-tested
      until the GCP service account is provisioned with domain-wide delegation
      and the manual Admin-console scope grants are completed.

      Pulls per-application audit/activity reports from
      `admin.googleapis.com/admin/reports/v1/activity/users/all/applications/<app>`.
      Auth: OAuth2 service account using JWT-with-subject (RS256) - the SA
      impersonates a designated Workspace admin email so the Reports API
      returns data scoped to the tenant.
    type: object
    properties:
      enabled:
        description: Enable Google Workspace source.
        type: boolean
        default: false
      service_account_key:
        description: |-
          Path to the service account JSON key file (same shape as the GCP
          source). The SA must have domain-wide delegation enabled and the
          required Reports API scopes granted in the Workspace Admin console.
        type:
        - string
        - 'null'
      credential_secret:
        description: |-
          Secret source spec for the SA key
          (e.g. `vault:secret/google_workspace:sa_key`).
        type:
        - string
        - 'null'
      admin_email:
        description: |-
          Admin email the SA impersonates (the `sub` claim of the signed JWT).
          Must be a Workspace admin in the target tenant; without this the
          Reports API returns 403.
        type:
        - string
        - 'null'
      customer_id:
        description: |-
          Customer ID. Defaults to `my_customer` (the tenant the SA's
          impersonated admin belongs to). Explicit C-prefixed IDs are only
          needed for multi-tenant reseller scenarios.
        type:
        - string
        - 'null'
      api_url_override:
        description: |-
          API base override for testing
          (default `https://admin.googleapis.com`).
        type:
        - string
        - 'null'
      token_url_override:
        description: |-
          Token endpoint override for testing
          (default `https://oauth2.googleapis.com/token`).
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/GoogleWorkspaceService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: google_workspace
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple Workspace tenants of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/GoogleWorkspaceConnection'
  GoogleWorkspaceService:
    description: |-
      Google Workspace service. Each maps to one `applicationName` under the
      Reports API: `login`, `admin`, `drive`, `mobile`, `groups`, `calendar`,
      `chat`, `meet`, `token`, etc.
    type: object
    properties:
      name:
        description: Service name; passed directly as the `applicationName` URL segment.
        type: string
      config:
        description: |-
          Service-specific configuration. Recognised keys:
          - `event_name`: filter to a single event name (optional).
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  GoogleWorkspaceConnection:
    description: |-
      One Google Workspace connection: a tenant (impersonated admin) + its SA key.
      Type-wide fields (`services`, `topic`, `filter`) are shared and stay on
      [`GoogleWorkspaceSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      service_account_key:
        description: Path to the service account JSON key file.
        type:
        - string
        - 'null'
      credential_secret:
        description: Secret source spec for the SA key ("provider:path:key").
        type:
        - string
        - 'null'
      admin_email:
        description: Admin email the SA impersonates (the `sub` claim of the signed JWT).
        type:
        - string
        - 'null'
      customer_id:
        description: Customer ID (defaults to `my_customer` when unset).
        type:
        - string
        - 'null'
      api_url_override:
        description: API base override for testing.
        type:
        - string
        - 'null'
      token_url_override:
        description: Token endpoint override for testing.
        type:
        - string
        - 'null'
      interval_secs:
        description: Per-connection fetch-interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
    required:
    - id
  GcpPubsubSourceConfig:
    description: |-
      GCP Pub/Sub pull source configuration.

      **Alpha** (code-complete, not production-validated) and additionally
      pending a hyperi-infra issue (TBD). The Pub/Sub pull
      source is written but cannot be exercised against the live HyperI GCP
      tenant until:

      1. A Cloud Logging Log Sink is provisioned to route the desired
         log entries (audit, VPC flow, DNS query, custom workloads) into
         a Pub/Sub topic.
      2. A Pub/Sub subscription is created on that topic for the fetcher
         SA to pull from.
      3. The fetcher's GCP SA is granted `roles/pubsub.subscriber` on the
         subscription.

      Subscriptions are read via the REST `:pull` endpoint (synchronous
      pull); the fetcher acknowledges drained messages with `:acknowledge`
      after they have been emitted to Kafka. The gRPC StreamingPull variant
      is intentionally not used - fetcher volumes do not justify the extra
      dependency surface (tonic + protobuf). If a tenant's subscription
      ever sustains volumes that REST pull cannot keep up with, revisit
      with a v2 source.

      Each subscription is one entry under `subscriptions`. The fetcher
      emits one record per Pub/Sub message; `message.data` is base64
      decoded and parsed as JSON if possible (typical for Log Sink
      payloads), otherwise emitted as a string.
    type: object
    properties:
      enabled:
        description: Enable Pub/Sub pull source.
        type: boolean
        default: false
      service_account_key:
        description: |-
          Path to a GCP service account JSON key file. The SA must have
          `roles/pubsub.subscriber` on every configured subscription.
        type:
        - string
        - 'null'
      credential_secret:
        description: |-
          Secret source spec for the SA key
          (e.g. `vault:secret/gcp-pubsub:sa_key`).
        type:
        - string
        - 'null'
      api_url_override:
        description: |-
          API base override for testing
          (default `https://pubsub.googleapis.com`).
        type:
        - string
        - 'null'
      token_url_override:
        description: |-
          OAuth2 token endpoint override for testing
          (default `https://oauth2.googleapis.com/token`).
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      subscriptions:
        description: |-
          Subscriptions to pull from. Each becomes one `FetchResult`
          tagged `gcp_pubsub.<subscription-id>`.
        type: array
        items:
          $ref: '#/$defs/GcpPubsubSubscription'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: gcp_pubsub
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
  GcpPubsubSubscription:
    description: A single Pub/Sub subscription configuration.
    type: object
    properties:
      project_id:
        description: GCP project ID owning the subscription.
        type: string
      subscription_id:
        description: Subscription ID (the short name, not the fully-qualified path).
        type: string
      max_messages:
        description: Maximum messages to pull per tick. Default 1000 (the REST API cap).
        type: integer
        format: uint32
        minimum: 0
        default: 1000
      return_immediately:
        description: |-
          Whether to return immediately when the subscription is empty,
          or block for `returnImmediately=false` server-side wait.
          Default true (single-shot, fits the polling fetcher model).
        type: boolean
        default: true
    required:
    - project_id
    - subscription_id
  ObjectStoreSourceConfig:
    description: |-
      Object-store source family configuration.

      Polls one or more bucket prefixes across S3 / GCS / Azure Blob,
      emitting one record per line of every new object since the cursor.

      Only the S3 backend is implemented. GCS and Azure Blob compile but their
      `list_new_objects` / `get_object` calls return a not-implemented error, so
      configuring one is safe (the source skips it with a warning) and fetches
      nothing.
    type: object
    properties:
      enabled:
        description: Enable object-store source.
        type: boolean
        default: false
      backends:
        description: One or more cloud-store backends to poll.
        type: array
        items:
          $ref: '#/$defs/ObjectStoreBackendConfig'
        default: []
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      topic:
        description: |-
          Default output topic. Each prefix may override it with its own
          `topic:` field.
        type: string
        default: object_store
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
  ObjectStoreBackendConfig:
    description: |-
      One backend: provider + auth + buckets/containers to tail.

      Provider is selected by the `provider` discriminator (serde-tagged
      enum). Each provider variant carries its own auth shape; only S3 is
      implemented.
    oneOf:
    - description: 'Amazon S3 (or S3-compatible: MinIO, R2, B2 via endpoint_override).'
      type: object
      properties:
        provider:
          type: string
          const: s3
      $ref: '#/$defs/S3BackendConfig'
      required:
      - provider
    - description: |-
        Google Cloud Storage. **Not implemented** - listing and fetching both
        return an error.
      type: object
      properties:
        provider:
          type: string
          const: gcs
      $ref: '#/$defs/GcsBackendConfig'
      required:
      - provider
    - description: |-
        Azure Blob Storage. **Not implemented** - listing and fetching both
        return an error.
      type: object
      properties:
        provider:
          type: string
          const: azure_blob
      $ref: '#/$defs/AzureBlobBackendConfig'
      required:
      - provider
  ObjectStoreBucket:
    description: One bucket / container to tail, plus its prefixes.
    type: object
    properties:
      bucket:
        description: Bucket (S3, GCS) or container (Azure Blob) name.
        type: string
      prefixes:
        description: Prefixes within the bucket to poll. At least one is required.
        type: array
        items:
          $ref: '#/$defs/ObjectStorePrefix'
    required:
    - bucket
    - prefixes
  ObjectStorePrefix:
    description: One prefix to tail, plus its format and routing.
    type: object
    properties:
      prefix:
        description: Object key prefix (may be empty to scan the whole bucket).
        type: string
        default: ''
      format:
        description: Object format. Drives parser dispatch and gzip handling.
        $ref: '#/$defs/ObjectStoreFormat'
      source_tag:
        description: |-
          Source tag attached to emitted records (e.g. `aws_cloudtrail`,
          `aws_vpc_flow`, `gcp_audit_sink`). Becomes the `source` field on
          the `FetchResult` as `object_store.<source_tag>`.
        type: string
      topic:
        description: |-
          Per-prefix Kafka topic override. Falls back to the source-level
          `topic` when unset.
        type:
        - string
        - 'null'
    required:
    - format
    - source_tag
  ObjectStoreFormat:
    description: Object body format. Drives gzip handling + parser dispatch.
    oneOf:
    - description: Gzipped JSON-lines (one JSON value per newline).
      type: string
      const: json_gz
    - description: Plain JSON-lines (one JSON value per newline).
      type: string
      const: jsonl
    - description: |-
        Single JSON document (array -> one record per element,
        object -> one record).
      type: string
      const: json
    - description: |-
        Gzipped plain text. Emits each non-empty line as `{"line": "..."}` -
        there is no ALB / CloudFront / S3 access-log parsing.
      type: string
      const: text_gz
    - description: Plain text. Same as `text_gz` minus the gunzip step.
      type: string
      const: text
  S3BackendConfig:
    description: S3 backend configuration.
    type: object
    properties:
      region:
        description: AWS region for SigV4 signing + endpoint construction.
        type: string
      endpoint_override:
        description: |-
          Optional S3 endpoint override for S3-compatible stores
          (MinIO, R2, B2) or for VPC endpoints. When unset, uses
          `https://<bucket>.s3.<region>.amazonaws.com`.
        type:
        - string
        - 'null'
      access_key_id:
        description: AWS access key ID. May be a `vault:` or `env:` spec.
        type:
        - string
        - 'null'
      secret_access_key:
        description: AWS secret access key. May be a `vault:` or `env:` spec.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: |-
          Vault secret spec containing both access_key_id +
          secret_access_key as a JSON object.
        type:
        - string
        - 'null'
      buckets:
        description: Buckets + prefixes to tail.
        type: array
        items:
          $ref: '#/$defs/ObjectStoreBucket'
    required:
    - region
    - buckets
  GcsBackendConfig:
    description: GCS backend configuration. **Not implemented.**
    type: object
    properties:
      service_account_key:
        description: Service account JSON key path.
        type:
        - string
        - 'null'
      credential_secret:
        description: Vault secret spec for the SA key.
        type:
        - string
        - 'null'
      buckets:
        description: Buckets + prefixes to tail.
        type: array
        items:
          $ref: '#/$defs/ObjectStoreBucket'
    required:
    - buckets
  AzureBlobBackendConfig:
    description: Azure Blob backend configuration. **Not implemented.**
    type: object
    properties:
      account:
        description: |-
          Storage account name (the `<name>` in
          `https://<name>.blob.core.windows.net`).
        type: string
      account_key:
        description: |-
          Shared Key (account key). May be a `vault:` or `env:` spec.
          Mutually exclusive with `sas_token` and `tenant_id`/`client_*`.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      sas_token:
        description: |-
          SAS token (without leading `?`). Mutually exclusive with
          `account_key` and SP credentials.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      tenant_id:
        description: Entra Service-Principal tenant ID (for OAuth2 bearer auth).
        type:
        - string
        - 'null'
      client_id:
        description: Entra Service-Principal client ID (for OAuth2 bearer auth).
        type:
        - string
        - 'null'
      client_secret:
        description: Entra Service-Principal client secret (for OAuth2 bearer auth).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: Vault secret spec for whichever auth method is in use.
        type:
        - string
        - 'null'
      buckets:
        description: |-
          Blob containers + prefixes to tail. The `bucket` field on each
          entry is the container name.
        type: array
        items:
          $ref: '#/$defs/ObjectStoreBucket'
    required:
    - account
    - buckets
  SalesforceSourceConfig:
    description: |-
      Salesforce audit source configuration.

      **Alpha** (code-complete, not production-validated) and additionally
      pending a Salesforce connected app + integration user for live testing
      (same status as [`GoogleWorkspaceSourceConfig`] and
      [`GcpPubsubSourceConfig`]). The fetcher code is complete but cannot be
      live-tested until a connected app is provisioned in a HyperI Salesforce org.

      Pulls security/audit data from a Salesforce org via the REST API:
      - `setup_audit_trail` - admin config changes (SOQL, every org)
      - `login_history` - login events (SOQL, every org)
      - `event_log_file` - runtime events as downloadable CSV log files
        (7 event types free with 1-day retention; 70+ with the Event
        Monitoring / Shield add-on)

      Auth is OAuth2 against `<login_url>/services/oauth2/token`, via one of
      two server-to-server flows selected by which fields are set:
      - **JWT bearer** (Salesforce-recommended): set `client_id` (connected
        app consumer key), `username` (integration user), and one of
        `private_key` / `private_key_secret` (RSA private key PEM). An RS256
        JWT is signed and exchanged for a token.
      - **client credentials**: set `client_id` + one of `client_secret` /
        `credential_secret`. Requires the connected app to have the client-
        credentials flow enabled with a run-as user.

      The token response carries an `instance_url` which is used for all
      subsequent API calls (not `login_url`). `instance_url_override` pins it
      for testing or custom-domain deployments.
    type: object
    properties:
      enabled:
        description: Enable Salesforce source.
        type: boolean
        default: false
      login_url:
        description: |-
          OAuth2 login base URL. Default `https://login.salesforce.com`.
          Sandboxes use `https://test.salesforce.com`; My Domain orgs may use
          `https://<mydomain>.my.salesforce.com`.
        type:
        - string
        - 'null'
      api_version:
        description: REST API version path segment. Default `v60.0`.
        type:
        - string
        - 'null'
      client_id:
        description: |-
          Connected app consumer key. Used as the JWT `iss` claim (JWT bearer)
          or the `client_id` form field (client credentials).
        type:
        - string
        - 'null'
      username:
        description: Integration username (JWT `sub` claim). JWT-bearer flow only.
        type:
        - string
        - 'null'
      private_key:
        description: |-
          RSA private key PEM for the JWT-bearer flow (full
          `-----BEGIN PRIVATE KEY-----` ... block). JWT-bearer flow only.
        type:
        - string
        - 'null'
      private_key_secret:
        description: |-
          Secret source spec resolving to the RSA private key PEM
          (e.g. `vault:secret/salesforce:private_key`). Takes precedence over
          `private_key` when set. JWT-bearer flow only.
        type:
        - string
        - 'null'
      client_secret:
        description: Connected app consumer secret. client-credentials flow only.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: |-
          Secret source spec resolving to the consumer secret
          (e.g. `vault:secret/salesforce:client_secret`). Takes precedence
          over `client_secret` when set. client-credentials flow only.
        type:
        - string
        - 'null'
      instance_url_override:
        description: |-
          Pin the API instance URL instead of using the token response's
          `instance_url`. For testing or custom-domain deployments.
        type:
        - string
        - 'null'
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/SalesforceService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: salesforce
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple Salesforce orgs of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/SalesforceConnection'
  SalesforceService:
    description: |-
      Salesforce service. `name` selects the audit surface:
      `setup_audit_trail`, `login_history`, or `event_log_file`.
    type: object
    properties:
      name:
        description: Service name (audit surface to pull).
        type: string
      config:
        description: |-
          Service-specific configuration. Recognised keys (event_log_file):
          - `event_types`: array of EventType values to include (default all)
          - `interval`: `"Hourly"` or `"Daily"` (default `"Daily"`)
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  SalesforceConnection:
    description: |-
      One Salesforce connection: an org + its OAuth2 credentials (JWT-bearer or
      client-credentials). Type-wide fields (`services`, `topic`, `filter`) are
      shared and stay on [`SalesforceSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      login_url:
        description: OAuth2 login base URL.
        type:
        - string
        - 'null'
      api_version:
        description: REST API version path segment.
        type:
        - string
        - 'null'
      client_id:
        description: Connected app consumer key.
        type:
        - string
        - 'null'
      username:
        description: Integration username (JWT `sub` claim). JWT-bearer flow only.
        type:
        - string
        - 'null'
      private_key:
        description: RSA private key PEM for the JWT-bearer flow.
        type:
        - string
        - 'null'
      private_key_secret:
        description: Secret source spec resolving to the RSA private key PEM.
        type:
        - string
        - 'null'
      client_secret:
        description: Connected app consumer secret (client-credentials flow only).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      credential_secret:
        description: Secret source spec resolving to the consumer secret ("provider:path:key").
        type:
        - string
        - 'null'
      instance_url_override:
        description: Pin the API instance URL for this connection.
        type:
        - string
        - 'null'
      interval_secs:
        description: Per-connection fetch-interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
    required:
    - id
  ExtractorsConfig:
    description: External extractors configuration.
    type: object
    properties:
      containers:
        description: Container-based extractors.
        type: array
        items:
          $ref: '#/$defs/ContainerExtractorConfig'
        default: []
      plugins:
        description: Deprecated plugin config (kept for backwards-compatible deserialisation).
        $ref: '#/$defs/PluginsConfig'
        default:
          directory: null
      vector:
        description: Vector.dev extractor integration.
        $ref: '#/$defs/VectorExtractorConfig'
        default:
          enabled: false
          grpc_bind_address: 0.0.0.0:6000
          instances: []
  ContainerExtractorConfig:
    description: |-
      Container-based extractor configuration.

      Each container runs an isolated extraction tool (any language/runtime).
      One container per source + config — no horizontal scaling needed.
    type: object
    properties:
      name:
        description: Unique name for this extractor instance.
        type: string
      image:
        description: Container image (e.g., "ghcr.io/org/tool:latest").
        type: string
      runtime:
        description: 'Container runtime (docker, podman). Default: "docker".'
        type:
        - string
        - 'null'
      mode:
        description: 'Run mode: "scheduled" (one-shot per tick) or "continuous" (long-running).'
        type: string
        default: scheduled
      communication:
        description: 'Communication mode: "stdout" (JSON lines) or "http" (POST to /ingest).'
        type: string
        default: stdout
      topic:
        description: Output Kafka topic for this extractor's data.
        type: string
      interval_secs:
        description: Fetch interval for scheduled mode (seconds).
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
      env:
        description: Environment variables passed to the container.
        type: object
        additionalProperties:
          type: string
        default: {}
      volumes:
        description: Volume mounts (host:container format).
        type: array
        items:
          type: string
        default: []
      network:
        description: Docker network to attach to.
        type:
        - string
        - 'null'
      memory_limit:
        description: Container memory limit (e.g., "512m", "1g").
        type:
        - string
        - 'null'
      cpu_limit:
        description: Container CPU limit (e.g., 0.5, 1.0, 2.0).
        type:
        - number
        - 'null'
        format: double
      command:
        description: Override container command.
        type:
        - array
        - 'null'
        items:
          type: string
      timeout_secs:
        description: Timeout in seconds for scheduled (one-shot) containers (0 = no timeout).
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      pull_policy:
        description: 'Image pull policy: "always", "if-not-present", "never". Default: "if-not-present".'
        type: string
        default: if-not-present
      max_restart_attempts:
        description: Maximum restart attempts for continuous mode (0 = unlimited).
        type: integer
        format: uint32
        minimum: 0
        default: 0
      max_restart_backoff_secs:
        description: Maximum backoff delay between restarts in seconds.
        type: integer
        format: uint64
        minimum: 0
        default: 60
      stable_after_secs:
        description: Seconds of stable running before resetting backoff counter.
        type: integer
        format: uint64
        minimum: 0
        default: 300
    required:
    - name
    - image
    - topic
  PluginsConfig:
    description: Deprecated plugin configuration — logs warning if non-empty values present.
    type: object
    properties:
      directory:
        type:
        - string
        - 'null'
        default: null
    additionalProperties: true
  VectorExtractorConfig:
    description: Vector.dev extractor configuration.
    type: object
    properties:
      enabled:
        description: Enable Vector extractor integration.
        type: boolean
        default: false
      grpc_bind_address:
        description: gRPC bind address for receiving Vector sink data.
        type: string
        default: 0.0.0.0:6000
      instances:
        description: Managed Vector instances.
        type: array
        items:
          $ref: '#/$defs/VectorInstance'
        default: []
  VectorInstance:
    description: A managed Vector instance configuration.
    type: object
    properties:
      name:
        description: Instance name.
        type: string
      mode:
        description: 'Run mode: "container" or "sidecar".'
        type: string
        default: container
      image:
        description: Container image for container mode.
        type:
        - string
        - 'null'
      vector_config:
        description: Vector configuration (inline TOML/YAML).
        type:
        - string
        - 'null'
      vector_config_path:
        description: Path to Vector configuration file.
        type:
        - string
        - 'null'
      topic:
        description: Output Kafka topic.
        type: string
    required:
    - name
    - topic
  IngestConfig:
    description: |-
      HTTP ingest server for container extractors to post data.

      Off unless a deployment enables it. `/ingest/{source}/{topic}` takes the
      destination topic from the URL, so an exposed listener with no token lets
      anything that can reach the port write to any topic.
    type: object
    properties:
      enabled:
        description: Enable ingest HTTP endpoint. Off by default.
        type: boolean
        default: false
      bind_address:
        description: Bind address.
        type: string
        default: 0.0.0.0:8080
      max_body_size:
        description: Maximum request body size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 10485760
      auth_token:
        description: |-
          Bearer token for authentication (credential resolver format).
          Empty or absent = no auth (backward compatible, logs warning).
        type:
        - string
        - 'null'
        default: null
  KafkaConfig:
    description: |-
      Legacy Kafka producer configuration.

      **Deprecated:** Use `output.kafka` (scalo `KafkaConfig`) instead.
      This struct is kept for backward compatibility with existing config files
      that use the top-level `kafka:` section. Will be removed in next major version.

      Migration: move your `kafka:` settings under `output.kafka:` using scalo
      `KafkaConfig` format (profiles, `librdkafka_overrides`, standard field names).
    type: object
    properties:
      brokers:
        description: Broker addresses.
        type: array
        items:
          type: string
        default: []
      client_id:
        description: Client ID.
        type: string
        default: dfe-fetcher
      topic_suffix:
        description: Suffix appended to source topic names.
        type: string
        default: _land
      sasl:
        description: SASL configuration.
        anyOf:
        - $ref: '#/$defs/SaslConfig'
        - type: 'null'
        default: null
      tls:
        description: TLS configuration.
        $ref: '#/$defs/KafkaTlsConfig'
        default:
          enabled: false
          ca_file: null
          cert_file: null
          key_file: null
      producer:
        description: Producer-specific settings.
        $ref: '#/$defs/ProducerConfig'
        default:
          batch_size: 8388608
          batch_messages: 10000
          linger_ms: 20
          compression: lz4
          acks: all
          retries: 5
  SaslConfig:
    description: SASL authentication configuration.
    type: object
    properties:
      enabled:
        description: Enable SASL.
        type: boolean
      mechanism:
        description: SASL mechanism (plain, scram_sha_256, scram_sha_512).
        type: string
      username:
        description: Username.
        type: string
      password:
        description: Password (always redacted in serialisation/debug output).
        type: string
        x-dfe-secret: true
        writeOnly: true
    required:
    - enabled
    - mechanism
    - username
    - password
  KafkaTlsConfig:
    description: Kafka TLS configuration.
    type: object
    properties:
      enabled:
        description: Enable TLS for Kafka.
        type: boolean
        default: false
      ca_file:
        description: CA certificate file.
        type:
        - string
        - 'null'
        default: null
      cert_file:
        description: Client certificate file.
        type:
        - string
        - 'null'
        default: null
      key_file:
        description: Client key file.
        type:
        - string
        - 'null'
        default: null
  ProducerConfig:
    description: Kafka producer settings.
    type: object
    properties:
      batch_size:
        description: Maximum batch size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 8388608
      batch_messages:
        description: Maximum messages per batch.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      linger_ms:
        description: Linger time in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 20
      compression:
        description: Compression type (none, gzip, snappy, lz4, zstd).
        type: string
        default: lz4
      acks:
        description: Acknowledgment level (0, 1, all).
        type: string
        default: all
      retries:
        description: Number of retries.
        type: integer
        format: uint32
        minimum: 0
        default: 5
  BufferConfig:
    description: Buffer and memory configuration.
    type: object
    properties:
      memory_limit:
        description: Maximum memory for buffers in bytes (0 = auto-detect 67% of available).
        type: integer
        format: uint
        minimum: 0
        default: 0
      pressure_threshold:
        description: Memory pressure threshold (0.0-1.0).
        type: number
        format: double
        default: 0.8
  MetricsConfig:
    description: Metrics configuration.
    type: object
    properties:
      enabled:
        description: Enable metrics.
        type: boolean
        default: true
      address:
        description: Metrics server address.
        type: string
        default: 0.0.0.0:9090
  DlqConfig:
    description: Top-level DLQ configuration.
    type: object
    properties:
      enabled:
        description: Whether DLQ is enabled.
        type: boolean
        default: true
      mode:
        description: Backend routing mode.
        $ref: '#/$defs/DlqMode'
        default: cascade
      queue_capacity:
        description: |-
          Bounded mpsc capacity. When the queue is full, `try_send` returns
          `QueueFull` (overflow=Drop). Sized for failure-burst tolerance.
          Default 10_000.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      batch_size:
        description: |-
          Drain coalesces up to this many entries into one backend write.
          Default 256.
        type: integer
        format: uint
        minimum: 0
        default: 256
      flush_interval_ms:
        description: |-
          Flush a partial batch after this duration, even if not full.
          Default 100 ms.
        type: integer
        format: uint64
        minimum: 0
        default: 100
      file:
        description: File backend configuration.
        $ref: '#/$defs/FileDlqConfig'
        default:
          enabled: true
          path: /var/spool/dfe/dlq
          rotation: hourly
          max_age_days: 30
          compress_rotated: true
      kafka:
        description: Kafka backend configuration.
        $ref: '#/$defs/KafkaDlqConfig'
        default:
          enabled: true
          routing: per_table
          topic_suffix: .dlq
          common_topic: dfe.dlq
          send_timeout_ms: 5000
  DlqMode:
    description: How backends are used when multiple are enabled.
    oneOf:
    - description: |-
        Try backends in order; stop on first success.
        Default order: Kafka first, file fallback.
      type: string
      const: cascade
    - description: Write to all enabled backends; report any failures.
      type: string
      const: fan_out
    - description: File backend only (no Kafka dependency).
      type: string
      const: file_only
    - description: Kafka backend only (current dfe-loader behaviour).
      type: string
      const: kafka_only
  FileDlqConfig:
    description: |-
      File-based DLQ configuration.

      Writes NDJSON files with automatic rotation and cleanup.
    type: object
    properties:
      enabled:
        description: Enable the file backend.
        type: boolean
        default: true
      path:
        description: |-
          Base directory for DLQ files.
          Service name is appended as a subdirectory.
        type: string
        default: /var/spool/dfe/dlq
      rotation:
        description: File rotation period.
        $ref: '#/$defs/RotationPeriod'
        default: hourly
      max_age_days:
        description: Auto-cleanup files older than this many days.
        type: integer
        format: uint32
        minimum: 0
        default: 30
      compress_rotated:
        description: Compress rotated files with flate2/gzip.
        type: boolean
        default: true
  RotationPeriod:
    description: File rotation period.
    oneOf:
    - description: Rotate files every hour.
      type: string
      const: hourly
    - description: Rotate files every day.
      type: string
      const: daily
  KafkaDlqConfig:
    description: Kafka-based DLQ configuration.
    type: object
    properties:
      enabled:
        description: Enable the Kafka backend.
        type: boolean
        default: true
      routing:
        description: Topic routing strategy.
        $ref: '#/$defs/DlqRouting'
        default: per_table
      topic_suffix:
        description: Suffix appended to destination for per-table routing.
        type: string
        default: .dlq
      common_topic:
        description: Common topic when routing is `Common` or destination is unknown.
        type: string
        default: dfe.dlq
      send_timeout_ms:
        description: Send timeout in milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 5000
  DlqRouting:
    description: Kafka DLQ topic routing strategy.
    oneOf:
    - description: |-
        Route to topic matching destination with suffix.
        e.g. "acme.auth" → "acme.auth.dlq"
      type: string
      const: per_table
    - description: Route all failures to a single common topic.
      type: string
      const: common
  OutputConfig:
    description: Output transport mode.
    type: object
    properties:
      type:
        description: 'Transport type: "kafka", "grpc", or "both".'
        type: string
        default: kafka
      kafka:
        description: Kafka transport configuration (scalo KafkaConfig).
        anyOf:
        - $ref: '#/$defs/KafkaConfig2'
        - type: 'null'
        default: null
      grpc:
        description: gRPC transport configuration (scalo GrpcConfig, client mode).
        anyOf:
        - $ref: '#/$defs/GrpcConfig'
        - type: 'null'
        default: null
      topic_suffix:
        description: |-
          Suffix appended to source topic names (e.g., "_land").
          If set, takes precedence over legacy `kafka.topic_suffix`.
        type:
        - string
        - 'null'
        default: null
      destinations:
        description: |-
          Named destinations beyond the default transports, keyed by name.

          The default destination is the source's own -- its topic on the bus,
          the configured endpoint on the direct transport. A destination declared
          here is reached by a [`route`](Self::routes) naming it, so a record can
          go to a transform instead of, or as well as, the default.
        type: object
        additionalProperties:
          $ref: '#/$defs/DestinationSpec'
        default: {}
      routes:
        description: Per-record routes over the named destinations (first match wins).
        type: array
        items:
          $ref: '#/$defs/OutputRoute'
        default: []
  KafkaConfig2:
    description: |-
      Kafka transport configuration.

      Uses a profile-based system where profiles provide opinionated defaults,
      and `librdkafka_overrides` allows overriding any setting.
    type: object
    properties:
      profile:
        description: |-
          Configuration profile (production, devtest).

          The profile provides baseline librdkafka settings optimized for the use case.
          Use `librdkafka_overrides` to customize specific settings.
        $ref: '#/$defs/KafkaProfile'
        default: production
      brokers:
        description: Kafka broker addresses.
        type: array
        items:
          type: string
        default:
        - localhost:9092
      group:
        description: Consumer group ID.
        type: string
        default: scalo-consumer
      client_id:
        description: Client ID for identification in broker logs.
        type: string
        default: scalo
      group_instance_id:
        description: |-
          Static group membership id (`group.instance.id`). Opt-in: `None` (the
          default) uses dynamic membership.

          Set this to a STABLE, UNIQUE-per-replica value (the K8s pod name is the
          canonical choice -- e.g. from `$HOSTNAME` / the downward API) to take
          static membership (KIP-345). A static member that restarts rejoins with
          its prior partitions WITHOUT triggering a group-wide rebalance, which
          turns a rolling restart of a large consumer fleet from dozens of
          stop-the-world rebalances into zero. Two replicas sharing one value get
          fenced -- the value MUST be unique per replica.
        type:
        - string
        - 'null'
        default: null
      topics:
        description: Topics to subscribe to.
        type: array
        items:
          type: string
        default: []
      auto_discover:
        description: |-
          Enable auto-discovery when `topics` is empty.
          When false (default), empty `topics` means no subscription (producer-only).
          When true, empty `topics` triggers broker auto-discovery with
          `topic_include`/`topic_exclude` filters and suppression rules.
        type: boolean
        default: false
      topic_include:
        description: |-
          Regex patterns for topic include filtering (empty = accept all).
          Topics must match at least one pattern (OR logic).
        type: array
        items:
          type: string
        default: []
      topic_exclude:
        description: |-
          Regex patterns for topic exclude filtering.
          Topics matching any pattern are excluded. Exclude wins over include.
          Default: `["^__", "_dlq$"]` -- Kafka internal topics and the DFE
          standard's dead-letter topics (a DLQ consumer sets its own include).
        type: array
        items:
          type: string
        default:
        - ^__
        - _dlq$
      topic_refresh_secs:
        description: |-
          Periodic topic refresh interval in seconds (0 = disabled).
          Only applies when `topics` is empty (auto-discovery mode).
        type: integer
        format: uint64
        minimum: 0
        default: 60
      topic_suppression_rules:
        description: |-
          Suppression rules: if a topic with preferred_suffix exists,
          suppress the topic with suppressed_suffix for the same base name.
          Default: _load suppresses _land (the convention).
        type: array
        items:
          $ref: '#/$defs/SuppressionRule'
        default:
        - preferred_suffix: _load
          suppressed_suffix: _land
      security_protocol:
        description: Security protocol (plaintext, ssl, sasl_plaintext, sasl_ssl).
        type: string
        default: plaintext
      provider:
        description: |-
          Optional managed-Kafka provider name (strimzi / redpanda / confluent-cloud /
          redpanda-cloud / msk / plaintext). When set, DERIVES security_protocol +
          sasl_mechanism from the opt-in provider presets -- the caller does NOT
          hand-set them. Applied by [`apply_provider`](KafkaConfig::apply_provider)
          before validate(). See [`providers`](super::providers).
        type:
        - string
        - 'null'
        default: null
      sasl_mechanism:
        description: SASL mechanism (PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, OAUTHBEARER).
        type:
        - string
        - 'null'
        default: null
      sasl_username:
        description: SASL username.
        type:
        - string
        - 'null'
        default: null
      sasl_password:
        description: SASL password.
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
        default: null
      ssl_ca_location:
        description: |-
          SSL CA certificate file path (private-CA bundle; maps to
          `TlsTrust.extra_roots` -- a single combined root+intermediate PEM is
          accepted).
        type:
        - string
        - 'null'
        default: null
      ssl_certificate_location:
        description: SSL client certificate file path (mTLS).
        type:
        - string
        - 'null'
        default: null
      ssl_key_location:
        description: SSL client key file path (mTLS).
        type:
        - string
        - 'null'
        default: null
      ssl_skip_verify:
        description: |-
          Skip SSL certificate verification.

          Automatically enabled for `devtest` profile.
        type: boolean
        default: false
      allow_insecure_transport:
        description: |-
          Deliberately permit an unencrypted transport (`plaintext` /
          `sasl_plaintext`) in production. Default `false`: production
          [`validate`](KafkaConfig::validate) rejects unencrypted transports so a
          misconfiguration cannot ship data/credentials in the clear. Set `true`
          only for an audited case (e.g. mesh-encrypted in-cluster traffic).
        type: boolean
        default: false
      enable_auto_commit:
        description: 'Enable auto-commit (default: false for manual commit).'
        type: boolean
        default: false
      auto_commit_interval_ms:
        description: Auto-commit interval in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      session_timeout_ms:
        description: Session timeout in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 45000
      heartbeat_interval_ms:
        description: Heartbeat interval in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 3000
      max_poll_interval_ms:
        description: Maximum poll interval in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 300000
      fetch_min_bytes:
        description: Fetch minimum bytes.
        type: integer
        format: int32
        default: 1
      fetch_max_bytes:
        description: Fetch maximum bytes.
        type: integer
        format: int32
        default: 52428800
      max_partition_fetch_bytes:
        description: Maximum messages per partition per poll.
        type: integer
        format: int32
        default: 1048576
      auto_offset_reset:
        description: Auto offset reset (earliest, latest, none).
        type: string
        default: earliest
      enable_partition_eof:
        description: Enable partition EOF events.
        type: boolean
        default: false
      sizing:
        description: |-
          Kafka sizing surface: profile + named knobs + raw librdkafka escape hatch.

          Controls the byte-budget and latency envelope for GET (consumer) and
          SEND (producer) paths. See [`KafkaSizingConfig`] for full documentation.

          Example YAML:
          ```yaml
          kafka:
            sizing:
              profile: throughput
              consumer:
                fetch_min_bytes: 2097152  # 2 MiB, overrides profile default
              producer:
                compression_type: zstd    # opt into zstd for storage-bound topics
              consumer_librdkafka:
                fetch.wait.max.ms: "75"   # raw override wins over everything
              producer_librdkafka:
                linger.ms: "50"
          ```
        $ref: '#/$defs/KafkaSizingConfig'
        default:
          profile: throughput
          consumer:
            fetch_min_bytes: null
            fetch_max_wait_ms: null
            max_partition_fetch_bytes: null
            fetch_max_bytes: null
            max_poll_records: null
          producer:
            batch_size_bytes: null
            linger_ms: null
            compression_type: null
            buffer_memory_bytes: null
            max_in_flight: null
            idempotence: null
          consumer_librdkafka: {}
          producer_librdkafka: {}
      librdkafka_overrides:
        description: |-
          Librdkafka configuration overrides.

          These settings override both the profile defaults and explicit config fields.
          Use this to customize any librdkafka setting not exposed as an explicit field.

          Example:
          ```yaml
          librdkafka_overrides:
            statistics.interval.ms: "5000"
            fetch.min.bytes: "2097152"
          ```
        type: object
        additionalProperties:
          type: string
        default: {}
      extra_config:
        description: Legacy field - use `librdkafka_overrides` instead.
        type: object
        additionalProperties:
          type: string
        deprecated: true
        default: {}
      filters_in:
        description: Inbound message filters (applied on recv before caller sees messages).
        type: array
        items:
          $ref: '#/$defs/FilterRule'
        default: []
      filters_out:
        description: Outbound message filters (applied on send before transport dispatches).
        type: array
        items:
          $ref: '#/$defs/FilterRule'
        default: []
  KafkaProfile:
    description: |-
      Kafka configuration profile.

      Profiles provide opinionated librdkafka defaults for specific use cases.
      Users can override any setting via `librdkafka_overrides`.
    oneOf:
    - description: |-
        Production profile: lean baseline for all data-plane services.

        Only sets values that differ from librdkafka defaults.
        Services add overrides via `librdkafka_overrides`.
      type: string
      const: production
    - description: |-
        Development/test profile: fast iteration, low memory.

        Cooperative rebalancing, fast reconnects, debug logging.
        SSL certificate verification disabled by default.
      type: string
      const: devtest
  SuppressionRule:
    description: |-
      Topic suppression rule for auto-discovery.

      When auto-discovering topics, if a topic with `preferred_suffix` exists
      for a base name, the topic with `suppressed_suffix` for that same base
      is removed. Default: `_load` suppresses `_land`.
    type: object
    properties:
      preferred_suffix:
        description: The suffix of the preferred (kept) topic.
        type: string
      suppressed_suffix:
        description: The suffix of the suppressed (removed) topic.
        type: string
    required:
    - preferred_suffix
    - suppressed_suffix
  KafkaSizingConfig:
    description: |-
      Kafka sizing surface: profile + named per-knob overrides + raw escape hatch.

      Resolution precedence (lowest to highest):
      1. `SelfRegulationProfile` defaults
      2. Named knobs in `consumer` / `producer` (explicit `Some(v)` wins)
      3. Raw librdkafka maps `consumer_librdkafka` / `producer_librdkafka` (wins
         over everything, applied last via `ClientConfig::set`)

      The raw maps are logged (one line per key) when they override a property
      that the sizing surface depends on (the fetch byte sizes and
      `enable.auto.commit`).
    type: object
    properties:
      profile:
        description: Sizing profile (throughput / balanced / low_latency).
        $ref: '#/$defs/SelfRegulationProfile'
        default: throughput
      consumer:
        description: Per-knob consumer overrides (any `Some(v)` beats the profile default).
        $ref: '#/$defs/ConsumerKnobs'
        default:
          fetch_min_bytes: null
          fetch_max_wait_ms: null
          max_partition_fetch_bytes: null
          fetch_max_bytes: null
          max_poll_records: null
      producer:
        description: Per-knob producer overrides (any `Some(v)` beats the profile default).
        $ref: '#/$defs/ProducerKnobs'
        default:
          batch_size_bytes: null
          linger_ms: null
          compression_type: null
          buffer_memory_bytes: null
          max_in_flight: null
          idempotence: null
      consumer_librdkafka:
        description: |-
          Raw librdkafka consumer properties applied LAST, winning over everything.

          Keys must be valid librdkafka property names (e.g. `fetch.wait.max.ms`).
          An invalid key silently no-ops in librdkafka -- double-check spelling.
        type: object
        additionalProperties:
          type: string
        default: {}
      producer_librdkafka:
        description: |-
          Raw librdkafka producer properties applied LAST, winning over everything.

          Keys must be valid librdkafka property names (e.g. `linger.ms`).
        type: object
        additionalProperties:
          type: string
        default: {}
  SelfRegulationProfile:
    description: |-
      Opinionated sizing profile for the Kafka GET/SEND surface.

      The profile sets default values for all named knobs below. An explicit
      per-knob value in [`KafkaSizingConfig`] always wins over the profile
      default. The raw librdkafka escape hatch in [`KafkaConfig`] wins over
      everything.

      Profiles target the BYTE-level throughput budget and latency envelope:

      | Profile | Use case |
      |---|---|
      | `throughput` (default) | PB/day batch ingest, large fanout topics |
      | `balanced` | Mixed OLTP + analytics, moderate batch size |
      | `low_latency` | Near-real-time, event-driven, small messages |
    oneOf:
    - description: |-
        Maximum throughput: generous byte budgets, tolerates batching delay.

        Consumer: 1 MiB fetch.min.bytes, 50 ms wait, 10 MiB per-partition,
        100 MiB total, 2000 poll-safety cap.
        Producer: 128 KiB batch, 20 ms linger, lz4, 64 MiB buffer, 5 in-flight.
      type: string
      const: throughput
    - description: |-
        Balanced: moderate batching, 5 ms linger, smaller per-partition budget.

        Consumer: 256 KiB fetch.min.bytes, 25 ms wait, 5 MiB per-partition,
        50 MiB total, 1000 poll-safety cap.
        Producer: 64 KiB batch, 5 ms linger, lz4, 32 MiB buffer, 5 in-flight.
      type: string
      const: balanced
    - description: |-
        Low latency: minimal batching delay, smaller buffers.

        Consumer: 1 byte fetch.min.bytes, 5 ms wait, 1 MiB per-partition,
        10 MiB total, 500 poll-safety cap.
        Producer: 16 KiB batch, 0 ms linger, lz4, 16 MiB buffer, 5 in-flight.
      type: string
      const: low_latency
  ConsumerKnobs:
    description: |-
      Named consumer sizing knobs.

      All fields are `Option<T>`: `None` means "use the profile default".
      An explicit `Some(v)` wins over the profile default.
    type: object
    properties:
      fetch_min_bytes:
        description: |-
          Minimum bytes the broker must have ready before responding to a Fetch.

          librdkafka: `fetch.min.bytes` (default 1 byte).
          Raising this batches more data per round-trip but adds latency when
          topic traffic is low.
        type:
        - integer
        - 'null'
        format: int32
        default: null
      fetch_max_wait_ms:
        description: |-
          Maximum milliseconds the broker may wait to fill `fetch.min.bytes`.

          librdkafka: `fetch.wait.max.ms` (default 500 ms).
          Works in tandem with `fetch_min_bytes` -- the broker returns whatever
          it has when this timer fires even if `fetch.min.bytes` is not met.
        type:
        - integer
        - 'null'
        format: uint32
        minimum: 0
        default: null
      max_partition_fetch_bytes:
        description: |-
          Maximum bytes returned per partition per Fetch request.

          librdkafka: `max.partition.fetch.bytes` (alias `fetch.message.max.bytes`,
          default 1 MiB). Must be >= the topic's `max.message.bytes`.
        type:
        - integer
        - 'null'
        format: int32
        default: null
      fetch_max_bytes:
        description: |-
          Maximum total bytes returned by the broker for a single Fetch request
          across all partitions.

          librdkafka: `fetch.max.bytes` (default 50 MiB).
        type:
        - integer
        - 'null'
        format: int32
        default: null
      max_poll_records:
        description: |-
          Maximum number of messages the recv() loop returns per call.

          NOTE: `max.poll.records` does NOT exist in librdkafka -- there is no
          broker-level property for this. This is a purely CLIENT-SIDE cap,
          enforced by passing this value as the `max` argument to
          `KafkaTransport::recv()` via `KafkaSizingConfig::effective_poll_cap()`.
          It bounds the batch size delivered to the WorkBatch layer, not the
          network fetch size (which is byte-governed by the knobs above).
        type:
        - integer
        - 'null'
        format: uint
        minimum: 0
        default: null
  ProducerKnobs:
    description: |-
      Named producer sizing knobs.

      All fields are `Option<T>`: `None` means "use the profile default".
    type: object
    properties:
      batch_size_bytes:
        description: |-
          Maximum bytes per MessageSet (librdkafka `batch.size`, default 1 MiB).

          This is the PER-BATCH ceiling, not the total queue size. Raise this for
          fewer, larger network writes. Note: `batch.size` in librdkafka is in
          bytes (matches the Java Kafka client name and unit).
        type:
        - integer
        - 'null'
        format: int32
        default: null
      linger_ms:
        description: |-
          Accumulation delay before transmitting a MessageSet.

          librdkafka: `linger.ms` (alias for `queue.buffering.max.ms`, default 5 ms).
          Higher values fill larger batches; 0 sends immediately.
        type:
        - integer
        - 'null'
        format: uint32
        minimum: 0
        default: null
      compression_type:
        description: |-
          Compression codec for MessageSets.

          librdkafka: `compression.type` (alias for `compression.codec`).
          Valid values: `none`, `gzip`, `snappy`, `lz4`, `zstd`.
          Default (all profiles): `lz4` -- best throughput/ratio tradeoff.
          Use `zstd` for storage-bound topics that can absorb the CPU cost.
        type:
        - string
        - 'null'
        default: null
      buffer_memory_bytes:
        description: |-
          Total byte budget for the producer's in-memory queue.

          librdkafka: `queue.buffering.max.kbytes` (in KiB, default 1 GiB).
          This is the TOTAL queue, not per-batch. Set lower to bound memory
          usage in containers. Stored as bytes in this struct; divided by 1024
          when applied to librdkafka.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      max_in_flight:
        description: |-
          Maximum concurrent in-flight requests per broker connection.

          librdkafka: `max.in.flight.requests.per.connection` (default 1,000,000).
          Set to 5 to match the exactly-once safe limit (KIP-98) and to bound
          memory/reorder window. Matches the Java Kafka producer default for
          idempotent producers.
        type:
        - integer
        - 'null'
        format: uint32
        minimum: 0
        default: null
      idempotence:
        description: |-
          Enable the Kafka idempotent producer (`enable.idempotence`).

          `None` (default) -> ON: scalo enables idempotence by default (v2.10) as
          the cheap "effectively-once" step -- it dedups producer-retry writes in
          the broker at near-zero cost. Idempotence REQUIRES `acks=all`,
          `max.in.flight<=5` and `retries>0`, so when on
          [`resolved_producer_map`](KafkaSizingConfig::resolved_producer_map)
          forces `acks=all` and clamps `max.in.flight` to 5. Set `Some(false)` to
          opt out (e.g. a latency-bound topic that wants `acks=1`). The raw
          `producer_librdkafka` escape hatch still wins over this.
        type:
        - boolean
        - 'null'
        default: null
  FilterRule:
    description: |-
      A single filter rule -- CEL expression + disposition action.

      Written in CEL syntax regardless of execution tier. The engine determines
      the optimal execution strategy at construction time.

      # Examples

      ```yaml
      - expression: 'has(_table)'
        action: drop
      - expression: 'status == "poison"'
        action: dlq
      ```
    type: object
    properties:
      expression:
        description: CEL expression to evaluate against each message payload.
        type: string
      action:
        description: Action to take when the expression matches. Defaults to `drop`.
        $ref: '#/$defs/FilterAction'
        default: drop
    required:
    - expression
  FilterAction:
    description: Disposition action when a filter matches.
    oneOf:
    - description: Silently discard the message (counted in metrics).
      type: string
      const: drop
    - description: Route the message to the dead-letter queue (counted + security audit).
      type: string
      const: dlq
  GrpcConfig:
    description: |-
      gRPC transport configuration.

      Supports client mode (sending), server mode (receiving), or both.

      # Client mode

      Set `endpoint` to connect to a remote gRPC server.

      # Server mode

      Set `listen` to accept incoming Push RPCs.

      # Both

      Set both for bidirectional communication (e.g., a relay node).
    type: object
    properties:
      listen:
        description: |-
          Server listen address (e.g., "0.0.0.0:6000").
          When set, the transport accepts incoming Push RPCs.
        type:
        - string
        - 'null'
        default: null
      endpoint:
        description: |-
          Client endpoint URI (e.g., "http://loader:6000").
          When set, the transport can send messages to a remote server.
        type:
        - string
        - 'null'
        default: null
      recv_buffer_size:
        description: Receive buffer size (messages buffered from incoming RPCs).
        type: integer
        format: uint
        minimum: 0
        default: 10000
      recv_timeout_ms:
        description: Receive timeout in milliseconds (0 = non-blocking).
        type: integer
        format: uint64
        minimum: 0
        default: 100
      send_timeout_ms:
        description: |-
          Per-RPC send deadline in milliseconds (0 = no deadline).

          Bounds a single `push` so a hung/black-holing server cannot block a
          sender task forever. Applied as the `grpc-timeout` header. Default 30s.
        type: integer
        format: uint64
        minimum: 0
        default: 30000
      max_message_size:
        description: Maximum message size in bytes (both send and receive).
        type: integer
        format: uint
        minimum: 0
        default: 16777216
      compression:
        description: Enable gzip compression for gRPC messages.
        type: boolean
        default: false
      tls_enabled:
        description: Enable client TLS for the `endpoint` connection.
        type: boolean
        default: false
      tls_ca_path:
        description: |-
          Private-CA PEM (maps to `TlsTrust.extra_roots`). When unset with
          `tls_enabled`, falls back to OS native roots.
        type:
        - string
        - 'null'
        default: null
      tls_domain:
        description: Domain name for SNI / certificate verification (overrides the URI host).
        type:
        - string
        - 'null'
        default: null
      tls_client_cert_path:
        description: Client certificate PEM for mTLS (with `tls_client_key_path`).
        type:
        - string
        - 'null'
        default: null
      tls_client_key_path:
        description: Client key PEM for mTLS (with `tls_client_cert_path`).
        type:
        - string
        - 'null'
        default: null
      vector_compat:
        description: |-
          Enable Vector wire protocol compatibility on the same server.
          When true, the server also accepts `/vector.Vector/PushEvents` RPCs
          from legacy Vector sinks.
          Requires the `transport-grpc-vector-compat` feature.
        type: boolean
        default: false
      filters_in:
        description: Inbound message filters (applied on recv before caller sees messages).
        type: array
        items:
          $ref: '#/$defs/FilterRule'
        default: []
      filters_out:
        description: Outbound message filters (applied on send before transport dispatches).
        type: array
        items:
          $ref: '#/$defs/FilterRule'
        default: []
  DestinationSpec:
    description: 'A declared destination: exactly one transport block.'
    type: object
    properties:
      grpc:
        description: |-
          Deliver over gRPC to a scalo Push listener (a transform, the loader,
          the archiver).
        anyOf:
        - $ref: '#/$defs/GrpcConfig'
        - type: 'null'
        default: null
      kafka:
        description: Deliver over the bus.
        anyOf:
        - $ref: '#/$defs/KafkaDestination'
        - type: 'null'
        default: null
  KafkaDestination:
    description: A bus destination.
    type: object
    properties:
      config:
        description: Broker settings for this destination. Unset reuses the output's own.
        anyOf:
        - $ref: '#/$defs/KafkaConfig2'
        - type: 'null'
        default: null
      topic:
        description: Fixed topic. Unset means the record's own source topic.
        type:
        - string
        - 'null'
        default: null
  OutputRoute:
    description: |-
      A per-record route: matched records go to the named destination(s) instead
      of the default.
    type: object
    properties:
      match_field:
        description: Top-level field to match.
        type: string
      match_value:
        description: Value to match.
        type: string
      destination:
        description: 'Destination for matched records: one name, or a list to fan out.'
        $ref: '#/$defs/DestinationRef'
    required:
    - match_field
    - match_value
    - destination
  DestinationRef:
    description: |-
      One destination name, or a list of them to fan a matched record out to.

      A fan-out is delivered when every destination has accepted it.
    anyOf:
    - description: A single destination name.
      type: string
    - description: Several destination names -- the record goes to all of them.
      type: array
      items:
        type: string
  CursorConfig:
    description: |-
      Cursor store configuration for incremental fetching.

      Cursors are stored as individual JSON files in `directory`, one per
      source service (e.g., `aws.cloudtrail.cursor.json`). The directory
      should be PVC-backed for pod restart persistence.

      If `directory` is empty, the cursor store falls back to the config
      file's parent directory with a warning.
    type: object
    properties:
      directory:
        description: |-
          Directory for cursor files. Each source gets its own file
          named `{instance_id}.{source}.{service}.cursor.json`.
          Empty = fall back to config file directory (with warning).
        type: string
        default: ''
      default_window_hours:
        description: Default lookback window in hours when no cursor exists.
        type: integer
        format: uint64
        minimum: 0
        default: 1
  ScalingPressureConfig:
    description: |-
      Base configuration for scaling pressure calculation.

      Lives in the app's config cascade so thresholds are env-var overridable
      (e.g., `DFE_LOADER__SCALING__MEMORY_GATE_THRESHOLD=0.9`).

      Component weights and saturation points are app-specific -- defined in
      each app's config and passed to [`super::ScalingPressure::new`] via
      [`ScalingComponent`].
    type: object
    properties:
      enabled:
        description: |-
          Enable scaling pressure calculation.
          When disabled, `calculate()` always returns 0.0.
        type: boolean
        default: true
      memory_gate_threshold:
        description: |-
          Memory usage ratio that triggers the memory gate (0.0-1.0).

          When `memory_used / memory_limit >= threshold`, scaling pressure
          is forced to 100.0 to trigger immediate scale-up before OOM.
        type: number
        format: double
        default: 0.8
