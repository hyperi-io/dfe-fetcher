$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: |-
  Main configuration struct.

  ## Hot-reload behaviour

  The config file is watched for changes. When reloaded, values are
  available via `SharedConfig::get()`. However, not all settings take
  effect without a restart.

  **Hot-reloaded (takes effect on next fetch cycle):**
  - `scheduler.default_interval_secs` — fetch interval re-computed each cycle
  - `scheduler.jitter_percent` — jitter re-computed each cycle
  - `kafka.topic_suffix` — topic name suffix re-read on each delivery
  - `sources.*.filter` — CEL filter re-evaluated on each record
  - `cursor.default_window_hours` — lookback window re-read when no cursor exists

  **Requires pod restart:**
  - `output.*` — transport connections established at startup
  - `kafka.*` (except `topic_suffix`) — transport config bound at startup
  - `ingest.*` — HTTP server binds at startup, auth token resolved once
  - `extractors.*` — containers and Vector instances spawned at startup
  - `metrics.*` — metrics server binds at startup
  - `instance_id` — cursor key prefix set at startup
  - `cursor.directory` — cursor store created at startup
  - `sources.*.enabled` — source registration at startup
  - `sources.*.credential_secret` / `tenant_id` / `client_id` etc. — credentials resolved once
  - `scheduler.max_concurrent_fetches` — semaphore created at startup
  - `dlq.*` — DLQ created at startup
  - `buffer.*` — buffer manager created at startup
type: object
properties:
  scheduler:
    description: Scheduler configuration.
    $ref: '#/$defs/SchedulerConfig'
    default:
      default_interval_secs: 300
      max_concurrent_fetches: 10
      jitter_percent: 10
  sources:
    description: Native source modules configuration.
    $ref: '#/$defs/SourcesConfig'
    default:
      aws:
        enabled: false
        region: us-east-1
        access_key_id: null
        secret_access_key: null
        assume_role_arn: null
        credential_secret: null
        interval_secs: null
        services: []
        topic: aws
        filter: null
      azure:
        enabled: false
        tenant_id: null
        client_id: null
        client_secret: null
        credential_secret: null
        subscription_id: null
        interval_secs: null
        services: []
        topic: azure
        filter: null
      m365:
        enabled: false
        tenant_id: null
        client_id: null
        client_secret: null
        credential_secret: null
        interval_secs: null
        services: []
        topic: m365
        filter: null
      gcp:
        enabled: false
        project_id: null
        service_account_key: null
        credential_secret: null
        interval_secs: null
        services: []
        topic: gcp
        filter: null
      github:
        enabled: false
        services: []
        topic: github
        filter: null
      okta:
        enabled: false
        use_ssws_header: true
        services: []
        topic: okta
        filter: null
      cloudflare:
        enabled: false
        services: []
        topic: cloudflare
        filter: null
      onepassword:
        enabled: false
        services: []
        topic: onepassword
        filter: null
      crowdstrike:
        enabled: false
        services: []
        topic: crowdstrike
        filter: null
      slack:
        enabled: false
        services: []
        topic: slack
        filter: null
      bitwarden:
        enabled: false
        services: []
        topic: bitwarden
        filter: null
      duo:
        enabled: false
        services: []
        topic: duo
        filter: null
      pypi:
        enabled: false
        packages: []
        topic: pypi
        filter: null
      crates_io:
        enabled: false
        crates: []
        topic: crates_io
        filter: null
      go_modules:
        enabled: false
        modules: []
        topic: go_modules
        filter: null
      google_workspace:
        enabled: false
        services: []
        topic: google_workspace
        filter: null
      gcp_pubsub:
        enabled: false
        subscriptions: []
        topic: gcp_pubsub
        filter: null
      object_store:
        enabled: false
        backends: []
        topic: object_store
        filter: null
      salesforce:
        enabled: false
        services: []
        topic: salesforce
        filter: null
  extractors:
    description: External extractors configuration (containers, vector).
    $ref: '#/$defs/ExtractorsConfig'
    default:
      containers: []
      plugins:
        directory: null
      vector:
        enabled: false
        grpc_bind_address: 0.0.0.0:6000
        instances: []
  ingest:
    description: HTTP ingest server configuration (for container extractors to post data).
    $ref: '#/$defs/IngestConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:8080
      max_body_size: 10485760
      auth_token: null
  kafka:
    description: Kafka producer configuration (output).
    $ref: '#/$defs/KafkaConfig'
    default:
      brokers: []
      client_id: dfe-fetcher
      topic_suffix: _land
      sasl: null
      tls:
        enabled: false
        ca_file: null
        cert_file: null
        key_file: null
      producer:
        batch_size: 8388608
        batch_messages: 10000
        linger_ms: 20
        compression: lz4
        acks: all
        retries: 5
  buffer:
    description: Buffer and memory configuration.
    $ref: '#/$defs/BufferConfig'
    default:
      memory_limit: 0
      pressure_threshold: 0.8
  metrics:
    description: Metrics configuration.
    $ref: '#/$defs/MetricsConfig'
    default:
      enabled: true
      address: 0.0.0.0:9090
  dlq:
    description: Dead letter queue configuration.
    $ref: '#/$defs/DlqConfig'
    default:
      enabled: true
      mode: cascade
      queue_capacity: 10000
      batch_size: 256
      flush_interval_ms: 100
      file:
        enabled: true
        path: /var/spool/dfe/dlq
        rotation: hourly
        max_age_days: 30
        compress_rotated: true
      kafka:
        enabled: true
        routing: per_table
        topic_suffix: .dlq
        common_topic: dfe.dlq
        send_timeout_ms: 5000
  config_reload_secs:
    description: Periodic config reload interval in seconds (0 = disabled, SIGHUP only).
    type: integer
    format: uint64
    minimum: 0
    default: 0
  instance_id:
    description: |-
      Instance identity for cursor isolation across multiple fetcher pods.
      Auto-derived from source config if omitted.
    type:
    - string
    - 'null'
    default: null
  output:
    description: Output transport configuration.
    $ref: '#/$defs/OutputConfig'
    default:
      type: kafka
      kafka: null
      grpc: null
      topic_suffix: null
      destinations: {}
      routes: []
  cursor:
    description: Cursor store configuration.
    $ref: '#/$defs/CursorConfig'
    default:
      directory: ''
      default_window_hours: 1
  scaling:
    description: Scaling pressure configuration for KEDA autoscaling.
    $ref: '#/$defs/ScalingPressureConfig'
    default:
      enabled: true
      memory_gate_threshold: 0.8
  unwrap_nested_json:
    description: |-
      Recursively unwrap double-serialised JSON string fields before delivery.

      When enabled (default), any string field whose value parses as a JSON
      object or array is replaced with the parsed value. This makes fields
      like AWS CloudTrail's `CloudTrailEvent` queryable as nested JSON in
      downstream systems like ClickHouse.

      Set to `false` for sources that intentionally store JSON as strings.
    type: boolean
    default: true
$defs:
  SchedulerConfig:
    description: Scheduler configuration for fetch timing.
    type: object
    properties:
      default_interval_secs:
        description: Default fetch interval in seconds (used when source doesn't specify its own).
        type: integer
        format: uint64
        minimum: 0
        default: 300
      max_concurrent_fetches:
        description: Maximum concurrent fetch tasks across all sources.
        type: integer
        format: uint
        minimum: 0
        default: 10
      jitter_percent:
        description: Jitter percentage (0-100) added to intervals to avoid thundering herd.
        type: integer
        format: uint8
        minimum: 0
        maximum: 255
        default: 10
  SourcesConfig:
    description: Top-level sources configuration.
    type: object
    properties:
      aws:
        description: AWS source configuration.
        $ref: '#/$defs/AwsSourceConfig'
        default:
          enabled: false
          region: us-east-1
          access_key_id: null
          secret_access_key: null
          assume_role_arn: null
          credential_secret: null
          interval_secs: null
          services: []
          topic: aws
          filter: null
      azure:
        description: Azure source configuration.
        $ref: '#/$defs/AzureSourceConfig'
        default:
          enabled: false
          tenant_id: null
          client_id: null
          client_secret: null
          credential_secret: null
          subscription_id: null
          interval_secs: null
          services: []
          topic: azure
          filter: null
      m365:
        description: Microsoft 365 source configuration.
        $ref: '#/$defs/M365SourceConfig'
        default:
          enabled: false
          tenant_id: null
          client_id: null
          client_secret: null
          credential_secret: null
          interval_secs: null
          services: []
          topic: m365
          filter: null
      gcp:
        description: Google Cloud Platform source configuration.
        $ref: '#/$defs/GcpSourceConfig'
        default:
          enabled: false
          project_id: null
          service_account_key: null
          credential_secret: null
          interval_secs: null
          services: []
          topic: gcp
          filter: null
      github:
        description: GitHub audit-log source configuration.
        $ref: '#/$defs/GithubSourceConfig'
        default:
          enabled: false
          services: []
          topic: github
          filter: null
      okta:
        description: Okta System Log source configuration.
        $ref: '#/$defs/OktaSourceConfig'
        default:
          enabled: false
          use_ssws_header: true
          services: []
          topic: okta
          filter: null
      cloudflare:
        description: Cloudflare audit-log source configuration.
        $ref: '#/$defs/CloudflareSourceConfig'
        default:
          enabled: false
          services: []
          topic: cloudflare
          filter: null
      onepassword:
        description: 1Password Events Reporting source configuration.
        $ref: '#/$defs/OnePasswordSourceConfig'
        default:
          enabled: false
          services: []
          topic: onepassword
          filter: null
      crowdstrike:
        description: CrowdStrike Falcon source configuration.
        $ref: '#/$defs/CrowdstrikeSourceConfig'
        default:
          enabled: false
          services: []
          topic: crowdstrike
          filter: null
      slack:
        description: Slack audit-log source configuration.
        $ref: '#/$defs/SlackSourceConfig'
        default:
          enabled: false
          services: []
          topic: slack
          filter: null
      bitwarden:
        description: Bitwarden Events API source configuration.
        $ref: '#/$defs/BitwardenSourceConfig'
        default:
          enabled: false
          services: []
          topic: bitwarden
          filter: null
      duo:
        description: Duo Admin API source configuration.
        $ref: '#/$defs/DuoSourceConfig'
        default:
          enabled: false
          services: []
          topic: duo
          filter: null
      pypi:
        description: PyPI supply-chain audit source configuration.
        $ref: '#/$defs/PypiSourceConfig'
        default:
          enabled: false
          packages: []
          topic: pypi
          filter: null
      crates_io:
        description: crates.io supply-chain audit source configuration.
        $ref: '#/$defs/CratesIoSourceConfig'
        default:
          enabled: false
          crates: []
          topic: crates_io
          filter: null
      go_modules:
        description: Go module-proxy supply-chain audit source configuration.
        $ref: '#/$defs/GoModulesSourceConfig'
        default:
          enabled: false
          modules: []
          topic: go_modules
          filter: null
      google_workspace:
        description: |-
          Google Workspace Reports API source configuration.

          **Alpha** - additionally pending hyperi-infra#5 (domain-wide-delegation
          service account + manual Admin-console scope grants) before live use.
        $ref: '#/$defs/GoogleWorkspaceSourceConfig'
        default:
          enabled: false
          services: []
          topic: google_workspace
          filter: null
      gcp_pubsub:
        description: |-
          GCP Pub/Sub pull source configuration.

          **Alpha** - additionally pending a hyperi-infra issue (TBD) for
          tenant-side Log Sink + Pub/Sub topic + subscription provisioning.
        $ref: '#/$defs/GcpPubsubSourceConfig'
        default:
          enabled: false
          subscriptions: []
          topic: gcp_pubsub
          filter: null
      object_store:
        description: |-
          Object-store source family configuration (S3 / GCS / Azure Blob).

          The S3 backend is live; GCS and Azure Blob are stubs that log-and-skip,
          so naming them here does not fail the tick.
        $ref: '#/$defs/ObjectStoreSourceConfig'
        default:
          enabled: false
          backends: []
          topic: object_store
          filter: null
      salesforce:
        description: |-
          Salesforce audit source configuration (SetupAuditTrail,
          LoginHistory, EventLogFile).

          **Alpha** - additionally pending a Salesforce connected app for live
          testing.
        $ref: '#/$defs/SalesforceSourceConfig'
        default:
          enabled: false
          services: []
          topic: salesforce
          filter: null
  AwsSourceConfig:
    description: AWS source configuration.
    type: object
    properties:
      enabled:
        description: Enable AWS source.
        type: boolean
        default: false
      region:
        description: AWS region.
        type: string
        default: us-east-1
      access_key_id:
        description: Access key ID (prefer secrets manager in production).
        type:
        - string
        - 'null'
        default: null
      secret_access_key:
        description: Secret access key (prefer secrets manager in production; always redacted in serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
        default: null
      assume_role_arn:
        description: Assume role ARN for cross-account access.
        type:
        - string
        - 'null'
        default: null
      credential_secret:
        description: |-
          Secret source for credentials.
          Format: "provider:path:key" (e.g., "vault:secret/aws:credentials")
        type:
        - string
        - 'null'
        default: null
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/AwsService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: aws
      endpoint_override:
        description: Endpoint URL override for testing (e.g., wiremock server URI).
        type:
        - string
        - 'null'
      filter:
        description: CEL filter expression applied to fetched records.
        type:
        - string
        - 'null'
        default: null
      connections:
        description: |-
          Multiple accounts/regions of this type, each polled independently.
          Empty = a single implicit connection from the fields above.
        type: array
        items:
          $ref: '#/$defs/AwsConnection'
  AwsService:
    description: AWS service to fetch data from.
    type: object
    properties:
      name:
        description: Service name (e.g., "cloudtrail", "guardduty", "securityhub", "config").
        type: string
      config:
        description: Service-specific configuration.
        type: object
        additionalProperties: true
        default: {}
    required:
    - name
  AwsConnection:
    description: |-
      One AWS connection: an account/region + its credentials. Type-wide fields
      (`services`, `topic`, `filter`) are shared and stay on [`AwsSourceConfig`].
    type: object
    properties:
      id:
        description: Stable, unique connection id (cursor key + metric/log label).
        type: string
      region:
        description: AWS region. Inherits the type-level `region` when unset.
        type:
        - string
        - 'null'
      access_key_id:
        description: Access key ID (prefer `credential_secret` in production).
        type:
        - string
        - 'null'
      secret_access_key:
        description: Secret access key (always redacted in serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
      assume_role_arn:
        description: Assume role ARN for cross-account access.
        type:
        - string
        - 'null'
      credential_secret:
        description: Secret source for credentials ("provider:path:key").
        type:
        - string
        - 'null'
      endpoint_override:
        description: Endpoint URL override for testing.
        type:
        - string
        - 'null'
      interval_secs:
        description: Per-connection fetch-interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
    required:
    - id
  AzureSourceConfig:
    description: Azure source configuration.
    type: object
    properties:
      enabled:
        description: Enable Azure source.
        type: boolean
        default: false
      tenant_id:
        description: Azure tenant ID.
        type:
        - string
        - 'null'
        default: null
      client_id:
        description: Client (application) ID.
        type:
        - string
        - 'null'
        default: null
      client_secret:
        description: Client secret (prefer secrets manager in production; always redacted in serialisation).
        type:
        - string
        - 'null'
        x-dfe-secret: true
        writeOnly: true
        default: null
      credential_secret:
        description: Secret source for credentials.
        type:
        - string
        - 'null'
        default: null
      subscription_id:
        description: Subscription ID.
        type:
        - string
        - 'null'
        default: null
      interval_secs:
        description: Fetch interval override in seconds.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      services:
        description: Services to fetch from.
        type: array
        items:
          $ref: '#/$defs/AzureService'
        default: []
      topic:
        description: Output Kafka topic.
        type: string
        default: azure
      management_url_override:
        description: Management API base URL override for testing.
        type:
        - string
        - 'null'
      graph_url_override:
