[default]
exclude-files = [
    # Needs the full runtime: the e2e smoke tests cover it.
    "src/main.rs",
    # Need Docker and Vector: the ignored e2e tests cover them.
    "src/extractor/container/mod.rs",
    "src/extractor/vector/mod.rs",
    "benches/*",
]
ignore-panics = true
timeout = "120s"
