# Project:   dfe-fetcher
# File:      Cargo.toml
# Purpose:   Data fetcher for external services (AWS, Azure, M365, GCP)
# Language:  Rust
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher"
version = "1.1.0-dev.3"
edition = "2024"
rust-version = "1.94"
description = "Data fetcher for external services (AWS, Azure, M365, GCP)"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-fetcher"
exclude = [".claude/", ".github/", "ai/", "ci/", "chart/", "docs/", "infra/", "reference/", "schemas/", "benches/"]

[lib]
name = "dfe_fetcher"
path = "src/lib.rs"
doctest = false

[dependencies]
# HyperI shared library
hyperi-rustlib = { version = ">=1.16.3", features = [
    "config",
    "config-reload",
    "logger",
    "metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "transport-grpc-vector-compat",
    "transport-memory",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    "dlq",
    "deployment",
    "cli",
    "top",
    "expression",
    "scaling",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures-core = "0.3"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# HTTP client (for API calls to external services)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }

# Performance
fastrand = "2"
rustc-hash = "2"
compact_str = "0.8"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP server (for metrics/health endpoints)
axum = "0.8"
bytes = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
sysinfo = "0.32"
url = "2"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# AWS SigV4 signing (reqsign — lightweight, no AWS SDK dependency)
reqsign = { version = "0.16", default-features = false, features = ["services-aws"] }
sha2 = "0.10"
hex = "0.4"

# OpenTelemetry proto types (for OTLP metric output)
opentelemetry-proto = { version = "0.28", features = ["gen-tonic-messages", "metrics"] }
prost = "0.13"

# Optional allocators
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio-test = "0.4"
dotenvy = "0.15"
wiremock = "0.6"
tower = "0.5"
opentelemetry-proto = { version = "0.28", features = ["gen-tonic-messages", "metrics"] }
prost = "0.13"

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"

[[bench]]
name = "pipeline"
harness = false
