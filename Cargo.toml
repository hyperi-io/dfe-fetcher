# Project:   dfe-fetcher
# File:      Cargo.toml
# Purpose:   Workspace root: the source framework crates and the fetcher app
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/rest",
    "crates/db",
    "crates/file",
    "crates/fetcher",
    # Vendored Vector file tailer (MIT); provenance in third-party/README.md.
    # Path-only, publish = false, depended on by crates/file behind `tail`.
    "third-party/vector-file-source",
    "third-party/vector-file-source-common",
]

# One version for every crate: hyperi-ci stamps this table on release and the
# members inherit it.
[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-fetcher"
description = "Pulls security and operational data from cloud and SaaS APIs, databases and files into the DFE pipeline over Kafka or gRPC"

[workspace.dependencies]
# Internal crates
dfe-fetcher-core = { path = "crates/core" }
dfe-fetcher-rest = { path = "crates/rest" }
dfe-fetcher-db = { path = "crates/db" }
dfe-fetcher-file = { path = "crates/file" }

# scalo shared library (crates.io). Features are chosen per member; the core
# takes `expression` only. The floor is the first release whose contract
# carries no vendor defaults, so the app names its own.
scalo = { version = "2.14.0", default-features = false }
# Same range scalo pins so ONE cel resolves and scalo's compiled `Program` is
# the type the framework holds.
cel = { version = ">=0.13, <0.14", features = ["json"] }
# Same range as scalo so cargo unifies to ONE schemars in the graph -- scalo's
# `SensitiveString` x-scalo-secret impl and our derives resolve against the same
# `JsonSchema` trait.
schemars = { version = ">=1.2.2, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Async runtime and streams
tokio = { version = "1.53.1", default-features = false }
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
futures = "0.3.34"
futures-core = "0.3.34"
async-trait = "0.1.92"

# Serialisation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
serde_ignored = "0.1.14"
bytes = "1.12.1"

# HTTP client. The REST path, reqsign's default context and scalo all send over
# this line, so the signed-request tests and scalo's request signer see ONE
# reqwest. Members pick features: `default-features = false` leaves charset,
# http2 and system-proxy to the members that want them, and `form` and `query`
# are opt-in regardless. TLS is rustls over aws-lc-rs verifying against the OS
# trust store (rustls-platform-verifier), so an operator-installed CA in the
# image is honoured.
reqwest = { version = "0.13.5", default-features = false }
async-compression = { version = "0.4.48", features = ["tokio", "gzip"] }
backon = "1.6.0"
url = "2.5.8"
axum = "0.8.9"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = "1.26.1"
smallvec = "1.16.1"
thiserror = "2.0.20"
itoa = "1.0.18"
memchr = "2.8.3"
base64 = "0.23.1"
# The `signature` auth mode: a keyed digest over a canonical string of the
# request, in the digest the profile names. hmac, sha1 and sha2 move together:
# all three must sit on the same digest line for `SimpleHmac<Sha256>` to compile.
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
# The RFC 3986 encoding a canonical query string is signed with; url's own
# dependency, so no new crate in the graph.
percent-encoding = "2.3.2"
# The RS256 assertion of the JWT-bearer grant; aws-lc-rs is the one crypto
# backend already in the graph through rustls.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
# Test-only RSA key generation for the JWT-bearer fixtures, jsonwebtoken's
# own backend so no second crypto crate enters the graph.
aws-lc-rs = "1.18.1"
# AWS SigV4 signing (reqsign -- lightweight, no AWS SDK dependency). reqsign
# signs an http::request::Parts and its default context sends STS and metadata
# calls over the same reqwest line as the REST path.
reqsign = { version = "0.20.6", default-features = false, features = ["aws", "default-context"] }
# reqsign signs an http::request::Parts, so the SigV4 mode projects one.
http = "1.5.0"
# OpenTelemetry proto types for the OTLP metric row builder. Same minor as
# scalo's opentelemetry line: each proto minor pulls its own opentelemetry and
# opentelemetry_sdk, so a newer one puts a second otel stack in the graph.
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "metrics"] }
prost = "0.14.4"
# The S3 lister reads ListObjectsV2 XML, the one XML the fetcher consumes.
quick-xml = "0.42.0"
csv = "1.4.0"
csv-core = "0.1.13"
glob = "0.3.4"
parking_lot = "0.12.5"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# Observability
tracing = "0.1.44"
metrics = ">=0.24.6, <0.25"

# Dev
tempfile = "3.27.0"
# A snapshotting recorder so a test can read the `metrics` series a crate emits.
metrics-util = { version = "0.20.4", features = ["debugging"] }

# `deny`, not `forbid`: the integration test binary allows `unsafe_code` around
# `std::env::set_var`, and a workspace `forbid` cannot be allowed back. The
# framework crates forbid it at their crate roots.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
