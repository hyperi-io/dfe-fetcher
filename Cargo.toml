# Project:   dfe-fetcher
# File:      Cargo.toml
# Purpose:   Data fetcher for external services (AWS, Azure, M365, GCP)
# Language:  Rust
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-fetcher"
version = "1.3.0"
edition = "2024"
rust-version = "1.94"
description = "Data fetcher for external services (AWS, Azure, M365, GCP)"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-fetcher"
exclude = [".github/", "chart/", "docs/", "infra/", "reference/", "schemas/", "benches/"]

[lib]
name = "dfe_fetcher"
path = "src/lib.rs"
doctest = false

# PGO workload driver — long-running mock-API server that drives the fetcher's
# hot path (HTTP fetch → JSON parse → enrichment → CEL filter → output produce
# → cursor advance) during hyperi-ci Tier 2 PGO/BOLT builds.
# Default builds skip this binary because of `required-features`.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo-driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# HyperI shared library
hyperi-rustlib = { version = ">=2.8.0", features = [
    "config",
    "config-reload",
    "logger",
    "metrics",
    "metrics-dfe",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "transport-grpc-vector-compat",
    "transport-memory",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    "dlq",
    "deployment",
    "cli-service",
    "top",
    "expression",
    "scaling",
    "memory",
    "version-check",
    "worker-pool",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = ">=0.3.31"
futures-core = "0.3"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# HTTP client (for API calls to external services).
# `default-features = false` drops the `default-tls` feature (which pulls
# native-tls + openssl). We use rustls exclusively. Re-enable charset/http2/
# system-proxy explicitly to preserve previous behaviour.
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "stream",
] }

# Performance
fastrand = "2"
rustc-hash = "2"
compact_str = "0.9"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics (global recorder integration via rustlib MetricsManager)
metrics = ">=0.24, <0.25"

# HTTP server (for metrics/health endpoints)
axum = "0.8"
bytes = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
url = "2"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# AWS SigV4 signing (reqsign — lightweight, no AWS SDK dependency)
reqsign = { version = "0.16", default-features = false, features = ["services-aws"] }
sha2 = "0.11"
hex = "0.4"

# Crypto for the Duo Admin API HMAC-SHA1 request signature scheme.
# Used only by src/source/duo. Other sources stick to SigV4 / OAuth bearer.
#
# sha1 stays on the 0.10.x line (digest 0.10) for compat with hmac 0.12.
# Bumping sha1 to 0.11 silently switches to digest 0.11 and breaks the
# `Hmac<Sha1>` instantiation. Re-evaluate when hmac releases 0.13+ with
# digest 0.11 support.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

# Gzip decompression for the object_store source family. Most bucket-
# delivered log feeds (CloudTrail, VPC Flow Logs, WAF, Cloud Logging
# storage sinks) gzip every object. miniz_oxide backend keeps the
# dependency surface small (no C zlib).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Small XML parser for AWS S3 ListObjectsV2 responses (the only XML the
# fetcher consumes; everything else is JSON). Stays out of the hot path.
quick-xml = "0.39"

# CSV parser for the Salesforce EventLogFile source. EventLogFile bodies
# are downloaded as CSV with a header row and quoted fields; hand-parsing
# quoting/escaping is error-prone, so use the mature `csv` crate (same
# call as quick-xml for S3 XML). Only used by src/source/salesforce.
csv = "1.3"

# OpenTelemetry proto types (for OTLP metric output)
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"

# Optional allocator (jemalloc-only per DFE allocator policy 2026-04-17)
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
tokio-test = "0.4"
dotenvy = "0.15"
wiremock = "0.6"
tower = "0.5"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
# Auto-managed Docker containers for integration tests (start + stop lifecycle).
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["localstack", "kafka"] }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
# Build the PGO workload driver bin (off by default — adds no transitive deps).
pgo-driver = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"

[[bench]]
name = "pipeline"
harness = false

