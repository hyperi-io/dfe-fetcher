# Project:   dfe-fetcher
# File:      Cargo.toml
# Purpose:   Workspace root: the source framework crates and the fetcher app
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/rest",
    "crates/db",
    "crates/file",
    "crates/fetcher",
    # Vector's file tailer, copied in: third-party/README.md.
    "third-party/vector-file-source",
    "third-party/vector-file-source-common",
]

# hyperi-ci stamps the version here on release, and every member inherits it.
[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-fetcher"
description = "Pulls data from cloud and SaaS APIs, databases and files into a DFE deployment."

[workspace.dependencies]
dfe-fetcher-core = { path = "crates/core" }
dfe-fetcher-rest = { path = "crates/rest" }
dfe-fetcher-db = { path = "crates/db" }
dfe-fetcher-file = { path = "crates/file" }

# Moves with `release.helm.library` in .hyperi-ci.yaml.
# 2.14.40: the git tree carries version 0.0.0 until the release stamps it.
scalo = { version = "0.0.0", git = "https://github.com/hyperi-io/scalo-rs", rev = "e8a3c79aeacf", default-features = false }
# scalo's range, so the framework holds scalo's compiled `Program` type.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }
# scalo's range, so its `SensitiveString` impl and our derives share one `JsonSchema` trait.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

tokio = { version = "1.54.1", default-features = false }
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
futures = "0.3.34"
futures-core = "0.3.34"
async-trait = "0.1.92"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bytes = "1.12.1"

# One reqwest line for the REST path, reqsign and scalo. Members pick its features.
reqwest = { version = "0.13.5", default-features = false }
async-compression = { version = "0.4.52", features = ["tokio", "gzip"] }
url = "2.5.8"
axum = "0.8.9"

chrono = { version = "0.4.45", features = ["serde"] }
uuid = "1.29.2"
smallvec = "1.16.5"
thiserror = "2.0.21"
itoa = "1.0.19"
memchr = "2.8.3"
base64 = "0.23.1"
# hmac, sha1 and sha2 move together: `SimpleHmac<Sha256>` compiles only on one digest line.
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
percent-encoding = "2.3.2"
# aws-lc-rs: the crypto backend rustls already brings in.
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
# Test-only RSA key generation.
aws-lc-rs = "1.19.0"
reqsign = { version = "0.20.7", default-features = false, features = ["aws", "default-context"] }
http = "1.5.0"
# scalo's opentelemetry minor: a newer one puts a second otel stack in the graph.
opentelemetry-proto = { version = "0.33", features = ["gen-tonic-messages", "metrics"] }
prost = "0.14.6"
quick-xml = "0.42.0"
csv-core = "0.1.13"
glob = "0.3.4"
parking_lot = "0.13.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

tracing = "0.1.44"
metrics = ">=0.24.6, <0.25"

tempfile = "3.27.0"
metrics-util = { version = "0.20.4", features = ["debugging"] }

# `deny`, not `forbid`: the integration tests allow `unsafe_code` around `std::env::set_var`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# Counts become f64 gauge values.
cast_precision_loss = "allow"
# Doc comments name database, cloud and protocol identifiers without backticks.
doc_markdown = "allow"
too_many_lines = "allow"
# The metric and timestamp casts are on values the surrounding code bounds.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
derivable_impls = "allow"
match_same_arms = "allow"
format_push_string = "allow"
unused_self = "allow"
map_unwrap_or = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
